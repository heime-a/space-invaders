<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Space Invaders (1978) - Authentic Arcade Replica</title>
    <style>
        :root {
            --arcade-black: #000000;
            --arcade-red: #ff2a2a;
            --arcade-cyan: #00ffff;
            --arcade-yellow: #ffff00;
            --arcade-white: #f0f0f0;
            --arcade-green: #00ff44;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #080808;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            aspect-ratio: 448 / 512;
            /* Dynamically scale 7:8 arcade playfield (224x256 @ 2x) to fit viewport without clipping */
            width: min(calc(100vw - 16px), calc((100vh - 16px) * (448 / 512)));
            width: min(calc(100dvw - 16px), calc((100dvh - 16px) * (448 / 512)));
            height: auto;
            max-height: calc(100vh - 16px);
            max-height: calc(100dvh - 16px);
            background: var(--arcade-black);
            overflow: hidden;
            border: 3px solid #222;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            outline: 2px solid #000;
        }

        /* Authentic CRT scanline & subtle cellophane phosphor glow */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 68, 0.02), rgba(0, 0, 255, 0.02));
            z-index: 25;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 6px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 0 15px;
            z-index: 30;
            font-weight: bold;
            font-size: clamp(13px, 2.4vmin, 20px);
            text-align: center;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .red-text { color: var(--arcade-red); }
        .white-text { color: var(--arcade-white); }
        .green-text { color: var(--arcade-green); }

        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            text-align: center;
            padding: 16px;
        }

        #score-table {
            margin-top: 16px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(10, 10, 10, 0.85);
            font-size: clamp(0.78rem, 1.9vmin, 1rem);
            line-height: 1.7;
            letter-spacing: 2px;
            text-align: left;
        }

        #score-table .table-header {
            text-align: center;
            color: var(--arcade-white);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 6px;
            padding-bottom: 4px;
            font-weight: bold;
        }

        #start-btn {
            margin-top: 22px;
            background: none;
            border: 2px solid var(--arcade-green);
            color: var(--arcade-green);
            padding: 12px 28px;
            font-size: clamp(1.05rem, 2.5vmin, 1.4rem);
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(0, 255, 68, 0.25);
        }

        #start-btn:active {
            background: rgba(0, 255, 68, 0.2);
        }

        /* Ergonomic split thumb controls anchored at bottom-left & bottom-right corners */
        #controls-wrapper {
            position: fixed;
            left: max(18px, var(--safe-left));
            right: max(18px, var(--safe-right));
            bottom: max(18px, var(--safe-bottom));
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 50;
        }

        #dpad-group {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .t-btn {
            width: 80px;
            height: 80px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.75);
            pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: transform 0.06s ease, background-color 0.06s ease, border-color 0.06s ease;
        }

        .t-btn.active,
        .t-btn:active {
            transform: scale(0.93);
            background: rgba(0, 255, 68, 0.22);
            border-color: var(--arcade-green);
            color: var(--arcade-white);
        }

        #f-btn {
            width: 88px;
            height: 88px;
            border-color: rgba(255, 42, 42, 0.65);
            color: var(--arcade-red);
            background: rgba(40, 0, 0, 0.55);
        }

        #f-btn.active,
        #f-btn:active {
            background: rgba(255, 42, 42, 0.3);
            border-color: var(--arcade-red);
        }

        /* Show touch controls on touch screens (including Z Fold 8 unfolded & folded) */
        @media (pointer: coarse), (hover: none), (max-width: 1024px) {
            #controls-wrapper {
                display: flex;
            }
        }

        /*
         * When in portrait / squarish unfolded orientation (aspect ratio < 1.15, e.g. Z Fold 8
         * unfolded portrait ~3:4 or cover screen), reserve vertical space at the bottom so the
         * corner thumb controls never obscure the player laser base or bottom HUD.
         */
        @media (max-aspect-ratio: 115/100) and (pointer: coarse),
               (max-aspect-ratio: 115/100) and (max-width: 1024px) {
            #game-wrapper {
                justify-content: flex-start;
                padding-top: 8px;
            }
            #game-container {
                width: min(calc(100vw - 12px), calc((100vh - 122px) * (448 / 512)));
                width: min(calc(100dvw - 12px), calc((100dvh - 122px) * (448 / 512)));
                max-height: calc(100vh - 122px);
                max-height: calc(100dvh - 122px);
            }
        }

        /* Compact button sizing for narrow cover display when folded */
        @media (max-width: 500px) {
            #game-container {
                border: none;
                border-radius: 0;
                width: min(100vw, calc((100vh - 108px) * (448 / 512)));
                width: min(100dvw, calc((100dvh - 108px) * (448 / 512)));
                max-height: calc(100vh - 108px);
                max-height: calc(100dvh - 108px);
            }
            .t-btn {
                width: 68px;
                height: 68px;
                font-size: 26px;
            }
            #f-btn {
                width: 74px;
                height: 74px;
            }
            #dpad-group {
                gap: 12px;
            }
        }
    </style>
</head>

        // Keep aliases so generic test harnesses can inspect SPRITES
        SPRITES.boss = SPRITES.squid;
        SPRITES.butterfly = SPRITES.crab;
        SPRITES.bee = SPRITES.octopus;

        let audioCtx = null;
        let noiseBuffer = null;
        // Authentic 1978 LM556 / 4-resistor divider bass frequencies (F2, Eb2, D2, C2)
        const MARCH_NOTES = [92.50, 82.41, 73.42, 65.41];
        let marchNoteIdx = 0;
        let soundCallLog = [];

        function getAudioCtx() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            if (audioCtx && audioCtx.state === 'suspended' && audioCtx.resume) {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Pre-generate CD4006 18-stage shift-register PRBS white noise buffer for explosions & laser shot
        function getNoiseBuffer(ctx) {
            if (noiseBuffer || !ctx || !ctx.createBuffer) return noiseBuffer;
            const sampleRate = ctx.sampleRate || 44100;
            const length = sampleRate * 1.2;
            noiseBuffer = ctx.createBuffer(1, length, sampleRate);
            const data = noiseBuffer.getChannelData(0);
            let lfsr = 0x1ffff;
            for (let i = 0; i < length; i++) {
                // 18-bit LFSR tap matching digital noise generator characteristics
                const bit = ((lfsr >> 0) ^ (lfsr >> 7)) & 1;
                lfsr = (lfsr >> 1) | (bit << 17);
                data[i] = (bit ? 1.0 : -1.0) * (0.75 + Math.random() * 0.25);
            }
            return noiseBuffer;
        }

        function playSfx(freq, type = 'square', duration = 0.1, endFreq = 10, gainLevel = 0.06) {
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime || 0;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), now + duration);
                gain.gain.setValueAtTime(gainLevel, now);
                gain.gain.linearRampToValueAtTime(0, now + duration);

                if (ctx.createBiquadFilter) {
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(Math.max(320, freq * 3.5), now);
                    osc.connect(filter);
                    filter.connect(gain);
                } else {
                    osc.connect(gain);
                }
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {}
        }

        // Port 5 Bits 0..3: LM556 4-note bass heartbeat ("thump-thump-thump-thump")
        function playMarchStepSound() {
            const freq = MARCH_NOTES[marchNoteIdx % 4];
            marchNoteIdx = (marchNoteIdx + 1) % 4;
            soundCallLog.push({ type: 'march', freq });
            if (soundCallLog.length > 64) soundCallLog.shift();
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime || 0;
                const dur = 0.085;
                const osc = ctx.createOscillator();
                const subOsc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.78, now + dur);

                subOsc.type = 'square';
                subOsc.frequency.setValueAtTime(freq * 0.5, now);
                subOsc.frequency.exponentialRampToValueAtTime(freq * 0.42, now + dur);

                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime ?
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur) :
                    gain.gain.linearRampToValueAtTime(0, now + dur);

                if (ctx.createBiquadFilter) {
                    const lp = ctx.createBiquadFilter();
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(210, now);
                    lp.Q.setValueAtTime(2.2, now);
                    osc.connect(lp);
                    subOsc.connect(lp);
                    lp.connect(gain);
                } else {
                    osc.connect(gain);
                    subOsc.connect(gain);
                }
                gain.connect(ctx.destination);
                osc.start(now);
                subOsc.start(now);
                osc.stop(now + dur);

                carrier.type = 'square';

                carrier.frequency.setValueAtTime(1040, now);
                carrier.frequency.exponentialRampToValueAtTime(480, now + dur * 0.45);

                // ~38 Hz LM3900 pitch modulation gives the iconic 1978 warbling alien death chirp
                modOsc.type = 'triangle';

                outGain.gain.setValueAtTime(0.075, now);
                outGain.gain.linearRampToValueAtTime(0, now + dur);

                if (carrier.frequency && typeof carrier.frequency === 'object') {
                    try {
                        modOsc.connect(modGain);
                        modGain.connect(carrier.frequency);
                    } catch (_) {}
                }
                carrier.connect(outGain);
                outGain.connect(ctx.destination);
                carrier.start(now);
                modOsc.start(now);
                carrier.stop(now + dur);
                modOsc.stop(now + dur);

        function createExplosion(x, y, count = 16, spriteType = 'alien') {
            const bandColor = getCellophaneColor(y);
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 0.7 + Math.random() * 2.6;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: 1.0,

                    color: bandColor,
                    size: 2
                });

            spriteExplosions.push({

                color: spriteType === 'ufo' ? PALETTE.R : (spriteType === 'player' ? PALETTE.G : bandColor),
                timer: 0,

            });

        function drawSprite(data, x, y, overrideColor = null, scale = SCALE) {
            const rows = data.length;
            const cols = data[0].length;
            const halfW = (cols * scale) / 2;
            const halfH = (rows * scale) / 2;
            for (let ri = 0; ri < rows; ri++) {
                const row = data[ri];
                const py = Math.round(y - halfH + ri * scale);
                const rowColor = overrideColor || getCellophaneColor(py);
                for (let ci = 0; ci < cols; ci++) {
                    const ch = row[ci];
                    if (ch !== '.') {
                        ctx.fillStyle = overrideColor || (ch === 'W' ? rowColor : (PALETTE[ch] || rowColor));
                        ctx.fillRect(Math.round(x - halfW + ci * scale), py, scale, scale);
                    }
                }
            }
        }

        class Bunker {
            constructor(x, y) {
                this.x = x; // Top-left X
                this.y = y; // Top-left Y
                this.rows = SPRITES.bunker.length; // 16
                this.cols = SPRITES.bunker[0].length; // 22
                this.width = this.cols * SCALE; // 44
                this.height = this.rows * SCALE; // 32
                this.pixels = SPRITES.bunker.map(row => row.split('').map(ch => ch !== '.'));
            }
            // Check if a point (px, py) hits any intact pixel of this bunker
            checkHit(px, py, radius = 3) {
                if (px < this.x - radius || px > this.x + this.width + radius ||
                    py < this.y - radius || py > this.y + this.height + radius) {
                    return false;
                }
                const cCenter = Math.floor((px - this.x) / SCALE);
                const rCenter = Math.floor((py - this.y) / SCALE);
                for (let r = Math.max(0, rCenter - 1); r <= Math.min(this.rows - 1, rCenter + 1); r++) {
                    for (let c = Math.max(0, cCenter - 1); c <= Math.min(this.cols - 1, cCenter + 1); c++) {
                        if (this.pixels[r][c]) return true;
                    }
                }
                return false;
            }
            // Blast a jagged crater around (px, py)
            erode(px, py, blastRadius = 3.2) {
                const cCenter = (px - this.x) / SCALE;
                const rCenter = (py - this.y) / SCALE;
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (!this.pixels[r][c]) continue;
                        const dist = Math.hypot(c - cCenter, r - rCenter);
                        if (dist <= blastRadius * 0.72 || (dist <= blastRadius && Math.random() < 0.68)) {
                            this.pixels[r][c] = false;
                        }
                    }
                }
            }
            // Slice shield pixels overlapped by a low-marching invader
            erodeBox(left, top, right, bottom) {
                const c0 = Math.max(0, Math.floor((left - this.x) / SCALE));
                const c1 = Math.min(this.cols - 1, Math.floor((right - this.x) / SCALE));
                const r0 = Math.max(0, Math.floor((top - this.y) / SCALE));
                const r1 = Math.min(this.rows - 1, Math.floor((bottom - this.y) / SCALE));
                for (let r = r0; r <= r1; r++) {
                    for (let c = c0; c <= c1; c++) {
                        this.pixels[r][c] = false;
                    }
                }
            }
            draw() {
                ctx.fillStyle = PALETTE.G;
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (this.pixels[r][c]) {
                            ctx.fillRect(this.x + c * SCALE, this.y + r * SCALE, SCALE, SCALE);
                        }
                    }
                }
            }
        }

                        this.exploding = false;
                        this.x = 56;
                        this.invulnerable = 75;
                    }
                    return;
                }
                if (this.invulnerable > 0) this.invulnerable--;

                const keyLeft = controllerInvertX ? (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6'])
                                                  : (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4']);
                const keyRight = controllerInvertX ? (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4'])
                                                   : (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6']);
                const moveLeft = keyLeft || touchState.left || gamepadState.left;
                const moveRight = keyRight || touchState.right || gamepadState.right;
                const firePressed = keys['Space'] || keys['Enter'] || keys['NumpadEnter'] || keys['KeyZ'] || keys['KeyX'] || keys['KeyK'] ||
                                    keys['ControlLeft'] || keys['ControlRight'] || keys['ShiftLeft'] || keys['ShiftRight'] ||
                                    touchState.fire || gamepadState.fire;

                if (moveLeft) this.x -= 2.0;
                if (moveRight) this.x += 2.0;
                this.x = Math.max(28, Math.min(WIDTH - 28, this.x));

                // Authentic 1978 Space Invaders rule: only 1 player laser shot on screen at a time!
                if (firePressed && this.cooldown <= 0 && bullets.length < 1) {
                    bullets.push({ x: this.x, y: this.y - 12 });
                    shotCount++;
                    playPlayerShootSound();

                drawSprite(SPRITES.player, this.x, this.y, PALETTE.G);

            const rowTypes = ['squid', 'crab', 'crab', 'octopus', 'octopus'];

        function spawnAlienMissile() {
            if (enemies.length === 0 || !player || player.exploding) return;

            // Group lowest living invader in each column (0..10)
            const lowestByCol = {};
            enemies.forEach(e => {
                const c = e.col !== undefined ? e.col : Math.round((e.x - 64) / 32);
                if (!lowestByCol[c] || e.y > lowestByCol[c].y) {
                    lowestByCol[c] = e;
                }
            });
            const activeCols = Object.keys(lowestByCol).map(Number);
            if (activeCols.length === 0) return;

            // Choose which of the 3 authentic shot types to fire
            const activeTypes = enemyBullets.map(b => b.type);
            let chosenType = null;
            let shooter = null;

            if (!activeTypes.includes('rolling')) {
                // Rolling shot always tracks the column closest to the player
                chosenType = 'rolling';
                let bestCol = activeCols[0];
                let bestDist = Infinity;
                activeCols.forEach(c => {
                    const d = Math.abs(lowestByCol[c].x - player.x);
                    if (d < bestDist) {
                        bestDist = d;
                        bestCol = c;
                    }
                });
                shooter = lowestByCol[bestCol];
            } else if (!activeTypes.includes('plunger') && enemies.length > 1) {
                // Authentic quirk: Plunger shot is disabled when only 1 invader remains!
                chosenType = 'plunger';
                for (let tries = 0; tries < PLUNGER_COL_TABLE.length; tries++) {
                    const col = PLUNGER_COL_TABLE[plungerIdx % PLUNGER_COL_TABLE.length];
                    plungerIdx++;
                    if (lowestByCol[col]) {
                        shooter = lowestByCol[col];
                        break;
                    }
                }
            } else if (!activeTypes.includes('squiggly') && !ufo) {
                // Authentic quirk: Squiggly shot shares memory with the UFO and only fires when UFO is absent
                chosenType = 'squiggly';
                for (let tries = 0; tries < SQUIGGLY_COL_TABLE.length; tries++) {
                    const col = SQUIGGLY_COL_TABLE[squigglyIdx % SQUIGGLY_COL_TABLE.length];
                    squigglyIdx++;
                    if (lowestByCol[col]) {
                        shooter = lowestByCol[col];
                        break;
                    }
                }
            }

            if (!shooter) {
                shooter = lowestByCol[activeCols[Math.floor(Math.random() * activeCols.length)]];
                chosenType = chosenType || 'rolling';
            }

            enemyBullets.push({
                x: shooter.x,
                y: shooter.y + 12,
                type: chosenType
            });
        }

        function update() {
            pollGamepad();
            if (!gameActive) return;
            frame++;
            if (stageBannerTimer > 0) stageBannerTimer--;
            if (statusBannerTimer > 0) statusBannerTimer--;
            if (alienFreezeTimer > 0) alienFreezeTimer--;

            if (player) player.update();

            // Mystery Ship (UFO) spawn & update (only spawns when >= 8 invaders remain, authentic ROM rule)
            if (!ufo) {
                if (enemies.length >= 8) {
                    ufoSpawnTimer--;
                    if (ufoSpawnTimer <= 0) {
                        // Direction depends on shotCount parity (authentic ROM rule)
                        const dir = (shotCount % 2 === 0) ? 1 : -1;
                        ufo = {
                            x: dir === 1 ? -20 : WIDTH + 20,
                            y: 52,
                            dir: dir,
                            speed: 1.75
                        };
                        ufoSpawnTimer = 1100 + Math.floor(Math.random() * 400);
                    }
                }
            } else {
                ufo.x += ufo.dir * ufo.speed;
                if (frame % 10 === 0) playUfoWarble();
                if ((ufo.dir === 1 && ufo.x > WIDTH + 28) || (ufo.dir === -1 && ufo.x < -28)) {
                    ufo = null;
                }
            }

            // Player bullets update & collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 7.5;

                // 1. Check collision with destructible bunkers/shields
                let consumed = false;
                for (let bi = 0; bi < bunkers.length; bi++) {
                    if (bunkers[bi].checkHit(b.x, b.y, 2)) {
                        bunkers[bi].erode(b.x, b.y, 3.0);
                        bullets.splice(i, 1);
                        consumed = true;
                        break;
                    }
                }
                if (consumed) continue;

                // 2. Check bullet-vs-bullet collision with incoming alien missiles
                for (let ebi = enemyBullets.length - 1; ebi >= 0; ebi--) {
                    const eb = enemyBullets[ebi];
                    if (Math.abs(b.x - eb.x) < 6 && Math.abs(b.y - eb.y) < 10) {
                        createExplosion(b.x, b.y, 8, 'shot');
                        bullets.splice(i, 1);
                        enemyBullets.splice(ebi, 1);
                        consumed = true;
                        break;
                    }
                }
                if (consumed) continue;

                // 3. Check collision with Mystery Ship (UFO)
                if (ufo && Math.abs(b.x - ufo.x) < 18 && Math.abs(b.y - ufo.y) < 12) {
                    const ufoPts = UFO_SCORE_TABLE[(Math.max(1, shotCount) - 1) % UFO_SCORE_TABLE.length];
                    awardScore(ufoPts);
                    createExplosion(ufo.x, ufo.y, 20, 'ufo');
                    scorePopups.push({ x: ufo.x, y: ufo.y + 4, text: ufoPts.toString(), color: PALETTE.R, timer: 55 });
                    playUfoExplosionSound();
                    ufo = null;
                    bullets.splice(i, 1);
                    continue;
                }

                // 4. Check collision with Invaders
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < 16) {
                        bullets.splice(i, 1);
                        consumed = true;
                        e.hp = (e.hp || 1) - 1;
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, 14, 'alien');
                            const pts = e.points || (e.type === 'squid' ? 30 : (e.type === 'crab' ? 20 : 10));
                            if (ei < rippleCursor) rippleCursor = Math.max(0, rippleCursor - 1);
                            enemies.splice(ei, 1);
                            awardScore(pts);
                            alienFreezeTimer = 15; // Authentic 1978 15-frame CPU pause on alien death
                            playInvaderKilledSound();
                        }
                        break;
                    }
                }
                if (consumed) continue;

                // 5. Top ceiling splash (y <= 42)
                if (b.y <= 42) {
                    createExplosion(b.x, 44, 6, 'shot');
                    bullets.splice(i, 1);
                }
            }

            // Authentic 1978 Invader Fleet 1-Alien-Per-Frame Ripple March & 4-Note Bass Heartbeat
            if (enemies.length > 0 && (!player || !player.exploding) && alienFreezeTimer <= 0) {
                // 1. 4-Note LM556 Analog Bass Heartbeat Timer
                fleetStepTimer++;
                const stepDelay = getFleetStepDelay(enemies.length);
                if (fleetStepTimer >= stepDelay) {
                    fleetStepTimer = 0;
                    playMarchStepSound();
                }

                // 2. 1-Alien-Per-Frame Intel 8080 Ripple Step (bottom-to-top, left-to-right)
                if (rippleCursor >= enemies.length) {
                    rippleCursor = 0;
                    fleetAnimFrame = (fleetAnimFrame + 1) % 2;
                    if (fleetDropPass) {
                        fleetDropPass = false;
                        edgeHitDuringPass = false;
                    } else if (edgeHitDuringPass) {
                        fleetDir *= -1;
                        fleetDropPass = true;
                        edgeHitDuringPass = false;
                    }
                }

                const steppingEnemy = enemies[rippleCursor];
                if (steppingEnemy) {
                    // Classic last-alien speed asymmetry ("fastest invader in the galaxy": +6px right, -4px left)
                    const stepX = enemies.length === 1 ? (fleetDir > 0 ? 6 : -4) : (fleetDir * 4);
                    if (fleetDropPass) {
                        steppingEnemy.y += 16; // Drop 8 arcade pixels (16 screen px)
                        steppingEnemy.x += stepX;
                    } else {
                        steppingEnemy.x += stepX;
                    }
                    steppingEnemy.animFrame = ((steppingEnemy.animFrame || 0) + 1) % 2;

                    if ((fleetDir > 0 && steppingEnemy.x >= WIDTH - 22) ||
                        (fleetDir < 0 && steppingEnemy.x <= 22)) {
                        edgeHitDuringPass = true;
                    }

                    // Invaders physically slice/erode any shield pixels they march through
                    if (steppingEnemy.y >= 368) {
                        for (let bi = 0; bi < bunkers.length; bi++) {
                            bunkers[bi].erodeBox(steppingEnemy.x - 12, steppingEnemy.y - 8, steppingEnemy.x + 12, steppingEnemy.y + 8);
                        }
                    }

                    rippleCursor++;
                    if (rippleCursor >= enemies.length) {
                        rippleCursor = 0;
                        fleetAnimFrame = (fleetAnimFrame + 1) % 2;
                        if (fleetDropPass) {
                            fleetDropPass = false;
                            edgeHitDuringPass = false;
                        } else if (edgeHitDuringPass) {
                            fleetDir *= -1;
                            fleetDropPass = true;
                            edgeHitDuringPass = false;
                        }
                    }
                }
            }

            // Check enemy direct collision with player or reaching player bottom line (Invasion!)
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                e.update();
                if (gameActive && player && !player.exploding) {
                    // If invaders reach the laser base vertical level, they overrun Earth!
                    if (e.y >= player.y - 6) {
                        handlePlayerHit(true);
                        break;
                    }
                    if (player.invulnerable <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < 18) {
                        createExplosion(e.x, e.y, 16, 'alien');
                        enemies.splice(ei, 1);
                        handlePlayerHit(false);
                        break;
                    }
                }
            }

            // Alien missile firing cadence
            if (gameActive && enemies.length > 0 && (!player || !player.exploding)) {
                alienShotCooldown--;
                const maxEnemyBullets = Math.min(3, 1 + Math.floor((55 - enemies.length) / 18) + Math.floor((level - 1) / 2));
                if (alienShotCooldown <= 0 && enemyBullets.length < maxEnemyBullets) {
                    spawnAlienMissile();
                    alienShotCooldown = Math.max(14, 38 - level * 3 - Math.floor((55 - enemies.length) * 0.35));
                }
            }

            // Enemy bullets update, bunker erosion, ground splash & player collision
            const shotSpeed = enemies.length <= 8 ? 4.2 : 3.2; // Alien shots speed up when <= 8 aliens remain (authentic ROM rule)
            for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
                const eb = enemyBullets[bi];
                eb.y += shotSpeed;

                // Check bunker hit from above
                let hitBunker = false;
                for (let bki = 0; bki < bunkers.length; bki++) {
                    if (bunkers[bki].checkHit(eb.x, eb.y, 2)) {
                        bunkers[bki].erode(eb.x, eb.y + 2, 3.2);
                        createExplosion(eb.x, eb.y, 5, 'shot');
                        enemyBullets.splice(bi, 1);
                        hitBunker = true;
                        break;
                    }
                }
                if (hitBunker) continue;

                // Check bottom green ground line splash (y >= 474)
                if (eb.y >= 474) {
                    createExplosion(eb.x, 472, 5, 'shot');
                    enemyBullets.splice(bi, 1);
                    continue;
                }

                // Check player hit
                if (gameActive && player && !player.exploding && player.invulnerable <= 0) {
                    if (Math.hypot(eb.x - player.x, eb.y - player.y) < 15) {
                        enemyBullets.splice(bi, 1);
                        handlePlayerHit(false);
                    }
                }
            }

            // Particles, sprite explosions & score popups update
            for (let pi = particles.length - 1; pi >= 0; pi--) {
                const p = particles[pi];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(pi, 1);
            }
            for (let si = spriteExplosions.length - 1; si >= 0; si--) {
                spriteExplosions[si].timer++;
                if (spriteExplosions[si].timer >= spriteExplosions[si].maxTimer) {
                    spriteExplosions.splice(si, 1);
                }
            }
            for (let spi = scorePopups.length - 1; spi >= 0; spi--) {
                scorePopups[spi].timer--;
                if (scorePopups[spi].timer <= 0) scorePopups.splice(spi, 1);
            }

            // Wave cleared -> advance to next wave & restore shields
            if (enemies.length === 0) {
                level++;
                bullets = [];
                enemyBullets = [];
                initBunkers();
                spawnWave();
                playExtraLifeFanfare();
            }

            const scoreEl = document.getElementById('score-display');
            if (scoreEl) scoreEl.innerText = score.toString().padStart(4, '0');
            if (score > highScore) {
                highScore = score;
                const hiEl = document.getElementById('high-score');
                if (hiEl) hiEl.innerText = highScore.toString().padStart(4, '0');
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            if (gameActive || player) {
                // Destructible green shields/bunkers
                bunkers.forEach(bk => bk.draw());

                // Mystery Ship (UFO) in red top band
                if (ufo) {
                    drawSprite(SPRITES.ufo, ufo.x, ufo.y, PALETTE.R);
                }

                // Player Laser Base
                if (player) player.draw();

                // Invaders (automatically colored by CRT cellophane band!)
                enemies.forEach(e => e.draw());

                // Player laser shot (1x8 arcade pixels -> 2x12 screen pixels)
                bullets.forEach(b => {
                    ctx.fillStyle = getCellophaneColor(b.y);
                    ctx.fillRect(b.x - 1, b.y - 6, 2, 12);
                });

                // 3 Distinct Animated Alien Missile Types (Rolling, Plunger, Squiggly)
                const shotAnimIdx = Math.floor(frame / 4) % 4;
                enemyBullets.forEach(eb => {
                    const key = eb.type === 'plunger' ? 'shot_plunger' : (eb.type === 'squiggly' ? 'shot_squiggly' : 'shot_rolling');
                    drawSprite(SPRITES[key][shotAnimIdx], eb.x, eb.y);
                });

                // Authentic pixel-art explosion sprites
                spriteExplosions.forEach(se => {
                    if (se.type === 'ufo') {
                        drawSprite(SPRITES.ufo_explosion, se.x, se.y, PALETTE.R);
                    } else if (se.type === 'shot') {
                        drawSprite(SPRITES.shot_explosion, se.x, se.y, se.color);
                    } else if (se.type === 'alien') {
                        drawSprite(SPRITES.alien_explosion, se.x, se.y, se.color);
                    }
                });

                // Particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillRect(p.x - 1, p.y - 1, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;

                // Bottom green ground baseline (authentic 1978 scanline y=239 -> 478)
                ctx.fillStyle = PALETTE.G;
                ctx.fillRect(16, 476, WIDTH - 32, 2);

                // Reserve Laser Bases HUD (bottom-left)
                for (let i = 0; i < Math.max(0, lives - 1); i++) {
                    drawSprite(SPRITES.player, 68 + i * 34, 494, PALETTE.G, 1.8);
                }

                // Floating score popups (50 / 100 / 150 / 300 UFO Mystery Score) & stage banners
                if (ctx.fillText) {
                    ctx.font = 'bold 15px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    scorePopups.forEach(sp => {
                        ctx.fillStyle = sp.color;
                        ctx.fillText(sp.text, sp.x, sp.y);
                    });

                    // Bottom-left lives count number & bottom-right CREDIT / WAVE
                    ctx.font = 'bold 16px "Courier New", monospace';
                    ctx.fillStyle = PALETTE.W;
                    ctx.textAlign = 'left';
                    ctx.fillText(Math.max(0, lives).toString(), 24, 500);
                    ctx.textAlign = 'right';
                    ctx.fillText(`WAVE ${level.toString().padStart(2, '0')}  CREDIT 01`, WIDTH - 20, 500);

                    ctx.textAlign = 'center';
                    if (stageBannerTimer > 0) {
                        ctx.font = 'bold 20px "Courier New", monospace';
                        ctx.fillStyle = PALETTE.G;
                        ctx.fillText(`WAVE ${level}`, WIDTH / 2, HEIGHT / 2 + 24);
                    }
                    if (statusBannerTimer > 0) {
                        ctx.font = 'bold 18px "Courier New", monospace';
                        ctx.fillStyle = statusBannerColor;
                        ctx.fillText(statusBannerText, WIDTH / 2, HEIGHT / 2 - 12);
                    }
                }
            }
        }

        const ARCADE_FPS = 60.0;
        const STEP_MS = 1000 / ARCADE_FPS;
        let lastTime = 0, accumulator = 0;

        function loop(timestamp) {
            pollGamepad();
            if (typeof timestamp === 'number') {
                if (!lastTime) lastTime = timestamp;
                const delta = Math.min(timestamp - lastTime, 100);
                lastTime = timestamp;
                accumulator += delta;
                while (accumulator >= STEP_MS) {
                    update();
                    accumulator -= STEP_MS;
                }
            } else {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        const keys = {};
        const touchState = { left: false, right: false, fire: false };
        const gamepadState = { left: false, right: false, fire: false, connected: false, name: '' };
        // Invert CRKD ATOM / controller horizontal direction by default; user can toggle anytime via [⇄ L/R] or Select (-)
        let controllerInvertX = true;
        try {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('si_invert_lr') !== null) {
                controllerInvertX = localStorage.getItem('si_invert_lr') === '1';
            }
        } catch (e) {}
        let prevGamepadStartPressed = false;
        let prevGamepadSelectPressed = false;
        let lastTelemetrySig = '';

        function sendInputTelemetry(tag, data) {
            try {
                const sig = tag + ':' + JSON.stringify(data);
                if (sig === lastTelemetrySig) return;
                lastTelemetrySig = sig;
                if (typeof fetch === 'function') {
                    fetch('/telemetry?t=' + encodeURIComponent(sig), { cache: 'no-store' }).catch(() => {});
                }
            } catch (e) {}
        }

        function syncFlipButtonUI() {
            const btn = document.getElementById('flip-lr-btn');
            if (btn) {
                btn.innerText = controllerInvertX ? '⇄ L/R: FLIPPED' : '⇄ L/R: NORMAL';
                btn.style.borderColor = controllerInvertX ? '#00ff44' : '#c77dff';
                btn.style.color = controllerInvertX ? '#00ff44' : '#c77dff';
            }
            const statusEl = document.getElementById('gamepad-status');
            if (statusEl && gamepadState.connected) {
                statusEl.innerText = `🎮 CRKD ATOM READY (${controllerInvertX ? 'L/R FLIPPED' : 'L/R NORMAL'} - TAP TO SWAP)`;
            }
        }

        function toggleInvertLR() {
            controllerInvertX = !controllerInvertX;
            try {
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('si_invert_lr', controllerInvertX ? '1' : '0');
                }
            } catch (e) {}
            syncFlipButtonUI();
            statusBannerText = controllerInvertX ? 'L/R DIRECTION: FLIPPED' : 'L/R DIRECTION: NORMAL';
            statusBannerColor = '#C77DFF';
            statusBannerTimer = 75;
            playSfx(controllerInvertX ? 880 : 660, 'square', 0.07, 440, 0.05);
            sendInputTelemetry('toggle_invert', { controllerInvertX });
        }

        // Normalize keyboard + Android Gamepad / CRKD ATOM Keyboard-mode key events
        function resolveKeyCodes(e) {
            const codes = [];
            if (e && e.code) codes.push(e.code);
            const k = e && e.key;
            const kc = e && e.keyCode;
            if (k === 'ArrowLeft' || kc === 21 || kc === 37) codes.push('ArrowLeft');
            if (k === 'ArrowRight' || kc === 22 || kc === 39) codes.push('ArrowRight');
            if (k === ' ' || k === 'Enter' ||
                kc === 23 || // KEYCODE_DPAD_CENTER
                kc === 66 || // KEYCODE_ENTER
                kc === 96 || // KEYCODE_BUTTON_A
                kc === 97 || // KEYCODE_BUTTON_B
                kc === 99 || // KEYCODE_BUTTON_X
                kc === 100 || // KEYCODE_BUTTON_Y
                kc === 102 || // KEYCODE_BUTTON_L1
                kc === 103 || // KEYCODE_BUTTON_R1
                kc === 104 || // KEYCODE_BUTTON_L2
                kc === 105 || // KEYCODE_BUTTON_R2
                kc === 108) { // KEYCODE_BUTTON_START
                codes.push('Space');
            }
            return codes;
        }

        window.onkeydown = e => {
            ensureAudio();
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = true; });
            sendInputTelemetry('keydown', { code: e && e.code, key: e && e.key, keyCode: e && e.keyCode, matched, invert: controllerInvertX });
            if (!gameActive && (matched.includes('Space') || matched.includes('Enter') || (e && e.keyCode === 108))) {
                if (e && e.preventDefault) e.preventDefault();
                startGame();
            }
        };
        window.onkeyup = e => {
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = false; });
        };

        // Full W3C Gamepad API polling for CRKD ATOM Collectible Keychain Controller
        // Supports Android Mode (Cyan), X-Input Mode (Orange), Switch Mode (White), and Stick-Remap modes
        function isBtnPressed(btn) {
            if (!btn) return false;
            if (typeof btn === 'object') return Boolean(btn.pressed || (btn.value && btn.value > 0.35));
            return Boolean(btn);
        }

        function updateGamepadStatusUI(connected, idStr = '') {
            const statusEl = document.getElementById('gamepad-status');
            if (!statusEl) return;
            if (connected) {
                const isCrkd = /crkd|atom|pro controller|xbox|gamepad|wireless controller/i.test(idStr);
                const label = isCrkd ? '🎮 CRKD ATOM CONTROLLER CONNECTED' : `🎮 CONTROLLER READY (${idStr.slice(0, 22)})`;
                statusEl.innerText = label;
                statusEl.style.color = '#00ff44';
            } else {
                statusEl.innerText = '🎮 CRKD ATOM / GAMEPAD: PRESS ANY BUTTON';
                statusEl.style.color = '#c77dff';
            }
        }

        function pollGamepad() {
            if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
            let pads;
            try {
                pads = navigator.getGamepads();
            } catch (e) {
                return;
            }
            if (!pads) return;

            let left = false, right = false, fire = false, startBtn = false, selectBtn = false;
            let foundPad = null;

            for (let i = 0; i < pads.length; i++) {
                const gp = pads[i];
                if (!gp || gp.connected === false) continue;
                foundPad = gp;
                const btns = gp.buttons || [];
                const axes = gp.axes || [];

                const activeBtns = [];
                for (let bi = 0; bi < btns.length; bi++) {
                    if (isBtnPressed(btns[bi])) activeBtns.push(bi);
                }
                const activeAxes = [];
                for (let ai = 0; ai < axes.length; ai++) {
                    const v = axes[ai];
                    if (typeof v === 'number' && Math.abs(v) > 0.25 && Math.abs(v - 1.2857) > 0.15 && Math.abs(v - 3.2857) > 0.15) {
                        activeAxes.push(ai + ':' + v.toFixed(2));
                    }
                }
                if (activeBtns.length > 0 || activeAxes.length > 0) {
                    sendInputTelemetry('pad', { id: gp.id, btns: activeBtns, axes: activeAxes, invert: controllerInvertX });
                }

                // 1. D-Pad Left / Right (Standard buttons 14 = Left, 15 = Right)
                if (isBtnPressed(btns[14])) left = true;
                if (isBtnPressed(btns[15])) right = true;

                // 2. Analog Axes / CRKD ATOM D-Pad-to-Stick modes:
                //    axes[0] = Left Stick X, axes[2] = Right Stick X, axes[4] / axes[6] = Android D-Input D-Pad X
                const horizAxes = [axes[0], axes[2], axes[4], axes[6]];
                for (let ai = 0; ai < horizAxes.length; ai++) {
                    const val = horizAxes[ai];
                    if (typeof val === 'number' && !Number.isNaN(val)) {
                        if (val < -0.3) left = true;
                        if (val > 0.3) right = true;
                    }
                }

                // 3. DirectInput / Switch Mode 8-way POV Hat Switch on axes[9] (Android Chrome HID mapping)
                if (axes.length >= 10 && typeof axes[9] === 'number') {
                    const hat = axes[9];
                    // Centered hat is typically > 1.1 (e.g., 1.2857 or 3.2857) or 0.0
                    // Right: Up-Right (-0.714), Right (-0.428), Down-Right (-0.142)
                    // Left: Down-Left (0.428), Left (0.714), Up-Left (1.0)
                    if (hat >= -0.80 && hat <= -0.05) right = true;
                    if (hat >= 0.35 && hat <= 1.05) left = true;
                }

                // 4. Fire buttons: CRKD ATOM B/A/Y/X face buttons (0, 1, 2, 3) + L/R shoulder buttons (4, 5, 6, 7)
                if (isBtnPressed(btns[0]) || isBtnPressed(btns[1]) ||
                    isBtnPressed(btns[2]) || isBtnPressed(btns[3]) ||
                    isBtnPressed(btns[4]) || isBtnPressed(btns[5]) ||
                    isBtnPressed(btns[6]) || isBtnPressed(btns[7])) {
                    fire = true;
                }

                // Select (-) button (8) toggles L/R direction when in-game
                if (isBtnPressed(btns[8])) {
                    selectBtn = true;
                }

                // 5. Start (+), CRKD Home (9, 16) or any face button starts game from menu
                if (isBtnPressed(btns[9]) || isBtnPressed(btns[16]) || fire) {
                    startBtn = true;
                }
            }

            if (selectBtn && !prevGamepadSelectPressed) {
                toggleInvertLR();
            }
            prevGamepadSelectPressed = selectBtn;

            if (foundPad && !gamepadState.connected) {
                gamepadState.connected = true;
                gamepadState.name = foundPad.id || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
                syncFlipButtonUI();
                sendInputTelemetry('pad_connected', { id: gamepadState.name });
            } else if (!foundPad && gamepadState.connected) {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            }

            if (controllerInvertX) {
                const tmp = left;
                left = right;
                right = tmp;
            }

            gamepadState.left = left;
            gamepadState.right = right;
            gamepadState.fire = fire;

            // Reflect physical controller input on the corner HUD indicators if visible
            const lEl = document.getElementById('l-btn');
            const rEl = document.getElementById('r-btn');
            const fEl = document.getElementById('f-btn');
            if (lEl && lEl.classList && !touchState.left) lEl.classList.toggle('active', left);
            if (rEl && rEl.classList && !touchState.right) rEl.classList.toggle('active', right);
            if (fEl && fEl.classList && !touchState.fire) fEl.classList.toggle('active', fire);

            // Edge-triggered start from menu overlay when pressing Start / Select / B / A / Y / X on CRKD ATOM
            if (startBtn && !prevGamepadStartPressed && !gameActive) {
                ensureAudio();
                startGame();
                // Prevent the button press that started the game from firing immediately on frame 1
                if (player) player.cooldown = 14;
            }
            prevGamepadStartPressed = startBtn;
        }

        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('gamepadconnected', e => {
                const gp = e && e.gamepad;
                gamepadState.connected = true;
                gamepadState.name = (gp && gp.id) || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
            });
            window.addEventListener('gamepaddisconnected', () => {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            });
        }

        function ensureAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }
        function setBtnState(el, k, state) {
            touchState[k] = state;
            if (el && el.classList) el.classList.toggle('active', state);
        }
        function bind(id, k) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, true);
                ensureAudio();
            };
            const deactivate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, false);
            };
            el.ontouchstart = activate;
            el.ontouchend = deactivate;
            el.ontouchcancel = deactivate;
            el.onmousedown = activate;
            el.onmouseup = deactivate;
            el.onmouseleave = deactivate;
        }
        bind('l-btn', 'left'); bind('r-btn', 'right'); bind('f-btn', 'fire');

        // Allow smooth thumb sliding between Left and Right buttons on the D-pad
        const dpadGroup = document.getElementById('dpad-group');
        if (dpadGroup) {
            const handleDpadTouch = e => {
                if (e && e.preventDefault) e.preventDefault();
                ensureAudio();
                const lEl = document.getElementById('l-btn');
                const rEl = document.getElementById('r-btn');
                if (!lEl || !rEl || !lEl.getBoundingClientRect) return;
                const lRect = lEl.getBoundingClientRect();
                const rRect = rEl.getBoundingClientRect();
                let leftHit = false, rightHit = false;
                const touches = e.touches || [];
                for (let i = 0; i < touches.length; i++) {
                    const t = touches[i];
                    if (t.clientX >= lRect.left - 12 && t.clientX <= lRect.right + 6 &&
                        t.clientY >= lRect.top - 24 && t.clientY <= lRect.bottom + 24) {
                        leftHit = true;
                    }
                    if (t.clientX >= rRect.left - 6 && t.clientX <= rRect.right + 12 &&
                        t.clientY >= rRect.top - 24 && t.clientY <= rRect.bottom + 24) {
                        rightHit = true;
                    }
                }
                setBtnState(lEl, 'left', leftHit);
                setBtnState(rEl, 'right', rightHit);
            };
            dpadGroup.ontouchstart = handleDpadTouch;
            dpadGroup.ontouchmove = handleDpadTouch;
            dpadGroup.ontouchend = handleDpadTouch;
            dpadGroup.ontouchcancel = handleDpadTouch;
        }

        function startGame() {
            ensureAudio();
            score = 0;
            level = 1;
            lives = 3;
            bonusLifeAwarded = false;
            shotCount = 0;
            bullets = [];
            enemyBullets = [];
            particles = [];
            spriteExplosions = [];
            scorePopups = [];
            ufo = null;
            statusBannerTimer = 0;
            player = new Player();
            initBunkers();
            spawnWave();
            gameActive = true;
            const scoreEl = document.getElementById('score-display');
            if (scoreEl) scoreEl.innerText = '0000';
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = '3';
            const titleEl = document.getElementById('menu-title');
            if (titleEl) titleEl.innerText = 'SPACE INVADERS';
            const subEl = document.getElementById('menu-sub');
            if (subEl) subEl.innerText = '1978 TAITO / MIDWAY ROM REPLICA';
            const btnEl = document.getElementById('start-btn');
            if (btnEl) btnEl.innerText = 'INSERT COIN / START';
            document.getElementById('menu-overlay').style.display = 'none';
        }

        document.getElementById('start-btn').onclick = startGame;

        let deferredInstallPrompt = null;
        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferredInstallPrompt = e;
                const installBtn = document.getElementById('install-btn');
                if (installBtn && installBtn.style) installBtn.style.display = 'inline-block';
            });
        }
        const installBtnEl = document.getElementById('install-btn');
        if (installBtnEl) {
            installBtnEl.onclick = async () => {
                if (!deferredInstallPrompt) return;
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                if (installBtnEl.style) installBtnEl.style.display = 'none';
            };
        }

        const flipBtnEl = document.getElementById('flip-lr-btn');
        if (flipBtnEl) {
            flipBtnEl.onclick = e => {
                if (e && e.stopPropagation) e.stopPropagation();
                ensureAudio();
                toggleInvertLR();
            };
        }
        const gpStatusEl = document.getElementById('gamepad-status');
        if (gpStatusEl) {
            gpStatusEl.style.cursor = 'pointer';
            gpStatusEl.onclick = () => {
                ensureAudio();
                toggleInvertLR();
            };
        }

        window.onload = () => {
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            syncFlipButtonUI();
            initBunkers();
            loop();
            if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    if (reg && reg.update) reg.update();
                }).catch(() => {});
            }
        };
    </script>
</body>
</html>
