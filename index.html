        // Authentic 1978 quirk: enemy shots exploding on the bottom baseline chip pixel notches out of the green line!
        function erodeGroundLine(px) {
            if (!groundLine || groundLine.length === 0) initGroundLine();
            const center = Math.floor(px / SCALE);
            // Jagged 4-5 arcade pixel crater matching bottom row of shot_explosion bitmap
            const offsets = [-2, -1, 0, 1, 2];
            for (let i = 0; i < offsets.length; i++) {
                const idx = center + offsets[i];
                if (idx >= 0 && idx < groundLine.length) {
                    if (Math.abs(offsets[i]) <= 1 || i % 2 === 0) {
                        groundLine[idx] = false;
                    }
                }
            }
        }

        function initBunkers() {
            bunkers = [];
            initGroundLine();
            // 4 evenly spaced bunkers across 448px playfield at y = 384 (native arcade y = 192)
            const spacing = 92;
            const startX = 64;
            for (let i = 0; i < 4; i++) {
                bunkers.push(new Bunker(startX + i * spacing, 384));
            }
        }

        class Player {
            constructor() {
                this.x = 56; // Authentic Space Invaders left-side spawn position
                this.y = 446;
                this.cooldown = 0;
                this.shotLockTimer = 0; // Locks next shot while previous shot's impact/ceiling splash is active
                this.exploding = false;
                this.explodeTimer = 0;
                this.invulnerable = 0;
            }
            update() {
                if (this.exploding) {
                    this.explodeTimer--;
                    if (this.explodeTimer <= 0) {
                        this.exploding = false;
                        this.x = 56;
                        this.invulnerable = 45;
                    }
                    return;
                }
                if (this.invulnerable > 0) this.invulnerable--;
                if (this.shotLockTimer > 0) this.shotLockTimer--;

                const keyLeft = controllerInvertX ? (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6'])
                                                  : (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4']);
                const keyRight = controllerInvertX ? (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4'])
                                                   : (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6']);
                const moveLeft = keyLeft || touchState.left || gamepadState.left;
                const moveRight = keyRight || touchState.right || gamepadState.right;
                const firePressed = keys['Space'] || keys['Enter'] || keys['NumpadEnter'] || keys['KeyZ'] || keys['KeyX'] || keys['KeyK'] ||
                                    keys['ControlLeft'] || keys['ControlRight'] || keys['ShiftLeft'] || keys['ShiftRight'] ||
                                    touchState.fire || gamepadState.fire;

                // Authentic 1978 speed: 1 arcade pixel per frame = 2.0 screen px/frame
                if (moveLeft) this.x -= 2.0;
                if (moveRight) this.x += 2.0;
                this.x = Math.max(30, Math.min(WIDTH - 30, this.x));

                // Authentic 1978 rule: strictly 1 player laser shot on screen at a time (including brief splash state)
                if (firePressed && this.cooldown <= 0 && this.shotLockTimer <= 0 && bullets.length < 1) {
                    bullets.push({ x: this.x, y: this.y - 10 });
                    shotCount++;
                    playPlayerShootSound();
                }
                if (this.cooldown > 0) this.cooldown--;
            }
            draw() {
                if (this.exploding) {
                    const expFrame = Math.floor(frame / 5) % 2;
                    drawSprite(SPRITES.player_explosion[expFrame], this.x, this.y, PALETTE.G);
                    return;
                }
                if (this.invulnerable > 0 && Math.floor(frame / 5) % 2 === 0) return;
                drawSprite(SPRITES.player, this.x, this.y, PALETTE.G);
            }
        }

        class Enemy {
            constructor(x, y, type, row = 0, col = 0) {
                this.x = x;
                this.y = y;
                this.tx = x;
                this.ty = y;
                this.type = type; // 'squid' (30), 'crab' (20), 'octopus' (10)
                this.row = row;
                this.col = col;
                this.hp = 1;
                this.animFrame = 0; // Toggles individually when this alien steps during the 1-alien-per-frame ripple
                this.state = 'formation';
                this.points = (type === 'squid' || type === 'boss') ? 30 : ((type === 'crab' || type === 'butterfly') ? 20 : 10);
                this.halfW = (type === 'squid' || type === 'boss') ? 9 : ((type === 'crab' || type === 'butterfly') ? 12 : 13);
            }
            update() {
                // Individual enemy update hook for compatibility
            }
            draw() {
                const frames = SPRITES[this.type] || SPRITES.octopus;
                const frameIdx = (this.animFrame !== undefined ? this.animFrame : fleetAnimFrame) % 2;
                const spr = frames[frameIdx];
                drawSprite(spr, this.x, this.y);
            }
        }

        // 1-alien-per-frame rack sweep period (55 frames at full rack -> 1 frame for the final lone alien)
        function getFleetStepDelay(aliveCount) {
            return Math.max(1, aliveCount);
        }

        // Authentic 1978 ROM 0x1A11/0x1A21 4-note analog bass heartbeat delay (52 frames -> 5 frames, never 60Hz buzz!)
        function getMarchSoundDelay(aliveCount) {
            for (let i = 0; i < MARCH_SOUND_THRESHOLDS.length; i++) {
                if (aliveCount > MARCH_SOUND_THRESHOLDS[i]) {
                    return MARCH_SOUND_DELAYS[i];
                }
            }
            return MARCH_SOUND_DELAYS[MARCH_SOUND_DELAYS.length - 1];
        }

        // Authentic 1978 ROM 0x1AA1/0x1CB8 score-based alien missile reload rate (in 3-frame shot steps)
        function getAlienReloadRate(currentScore) {
            if (currentScore < 300) return 48;
            if (currentScore < 1100) return 16;
            if (currentScore < 2100) return 11;
            if (currentScore < 3100) return 8;
            return 7;
        }

        function spawnWave() {
            enemies = [];
            ufo = null;
            ufoSpawnTimer = 1200; // ~20s initial saucer arrival; subsequent spawns use ROM 1536-frame (~25.6s) cadence
            shotCount = 0;
            fleetDir = 1;
            fleetAnimFrame = 0;
            fleetStepTimer = 0;
            rippleCursor = 0;
            fleetDropPass = false;
            edgeHitDuringPass = false;
            alienShotCooldown = 20;
            alienShotSlotCycle = 0;
            stageBannerTimer = level === 1 ? 75 : 0;

            // Authentic 1978 ROM 0x1DA3 AlienStartTable rack drop progression
            const rackDrop = level <= 1 ? 0 : WAVE_START_DROP_TABLE[(level - 2) % WAVE_START_DROP_TABLE.length];
            const startY = 128 + rackDrop;
            const startX = 64;
            const colSpacing = 32; // Exact 16 arcade px
            const rowSpacing = 32; // Exact 16 arcade px (8px sprite + 8px gap)

            // 5 rows x 11 columns = 55 Invaders
            // Stored in authentic 1978 Intel 8080 ripple update order:
            // Bottom row (row 4) to Top row (row 0), Left column (col 0) to Right column (col 10)
            // Row 0: Squid (30 pts), Rows 1-2: Crab (20 pts), Rows 3-4: Octopus (10 pts)
            const rowTypes = ['squid', 'crab', 'crab', 'octopus', 'octopus'];
            for (let r = 4; r >= 0; r--) {
                for (let c = 0; c < 11; c++) {
                    enemies.push(new Enemy(startX + c * colSpacing, startY + r * rowSpacing, rowTypes[r], r, c));
                }
            }
        }

        function awardScore(pts) {
            const prevScore = score;
            score += pts;
            // Authentic 1978 Space Invaders extra laser base at 1,500 points!
            if (!bonusLifeAwarded && prevScore < 1500 && score >= 1500) {
                bonusLifeAwarded = true;
                lives++;
                const livesEl = document.getElementById('lives-display');
                if (livesEl) livesEl.innerText = lives;
                statusBannerText = 'EXTRA BASE';
                statusBannerColor = PALETTE.G;
                statusBannerTimer = 95;
                playExtraLifeFanfare();
            }
        }

        function handlePlayerHit(invasionOverrun = false) {
            if (!gameActive || !player) return;
            if (!invasionOverrun && (player.exploding || player.invulnerable > 0)) return;

            player.exploding = true;
            player.explodeTimer = 60;
            createExplosion(player.x, player.y, 28, 'player');
            playPlayerExplosionSound();

            if (invasionOverrun) {
                lives = 0;
                statusBannerText = 'GAME OVER';
                statusBannerColor = PALETTE.R;
                statusBannerTimer = 120;
            } else {
                lives--;
            }

            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = Math.max(0, lives);

            if (lives <= 0) {
                player.explodeTimer = 999999;
                setTimeout(() => {
                    gameActive = false;
                    const titleEl = document.getElementById('menu-title');
                    const subEl = document.getElementById('menu-sub');
                    const btnEl = document.getElementById('start-btn');
                    if (titleEl) titleEl.innerText = 'GAME OVER';
                    if (subEl) subEl.innerText = `SCORE: ${(score % 10000).toString().padStart(4, '0')}`;
                    if (btnEl) btnEl.innerText = 'PLAY AGAIN';
                    document.getElementById('menu-overlay').style.display = 'flex';
                }, 1200);
            }
        }

        function spawnAlienMissile() {
            if (enemies.length === 0 || !player || player.exploding) return;

            // Group lowest living invader in each column (0..10)
            const lowestByCol = {};
            enemies.forEach(e => {
                const c = e.col !== undefined ? e.col : Math.round((e.x - 64) / 32);
                if (!lowestByCol[c] || e.y > lowestByCol[c].y) {
                    lowestByCol[c] = e;
                }
            });
            const activeCols = Object.keys(lowestByCol).map(Number);
            if (activeCols.length === 0) return;

            // Cycle through the 3 authentic shot slots (0: rolling, 1: plunger, 2: squiggly)
            const activeTypes = enemyBullets.map(b => b.type);
            const order = ['rolling', 'plunger', 'squiggly'];
            let chosenType = null;
            let chosenSlot = 0;
            let shooter = null;

            for (let attempt = 0; attempt < 3; attempt++) {
                const idx = (alienShotSlotCycle + attempt) % 3;
                const cand = order[idx];
                if (activeTypes.includes(cand)) continue;
                if (cand === 'plunger' && enemies.length <= 1) continue; // Authentic quirk: Plunger disabled on final alien
                if (cand === 'squiggly' && ufo) continue; // Authentic quirk: Squiggly shares task slot with UFO
                chosenType = cand;
                chosenSlot = idx;
                alienShotSlotCycle = (idx + 1) % 3;
                break;
            }
            if (!chosenType) return;

            if (chosenType === 'rolling') {
                // Rolling shot always targets the column closest to the player
                let bestCol = activeCols[0];
                let bestDist = Infinity;
                activeCols.forEach(c => {
                    const d = Math.abs(lowestByCol[c].x - player.x);
                    if (d < bestDist) {
                        bestDist = d;
                        bestCol = c;
                    }
                });
                shooter = lowestByCol[bestCol];
            } else if (chosenType === 'plunger') {
                for (let tries = 0; tries < PLUNGER_COL_TABLE.length; tries++) {
                    const col = PLUNGER_COL_TABLE[plungerIdx % PLUNGER_COL_TABLE.length];
                    plungerIdx++;
                    if (lowestByCol[col]) {
                        shooter = lowestByCol[col];
                        break;
                    }
                }
            } else if (chosenType === 'squiggly') {
                for (let tries = 0; tries < SQUIGGLY_COL_TABLE.length; tries++) {
                    const col = SQUIGGLY_COL_TABLE[squigglyIdx % SQUIGGLY_COL_TABLE.length];
                    squigglyIdx++;
                    if (lowestByCol[col]) {
                        shooter = lowestByCol[col];
                        break;
                    }
                }
            }

            if (!shooter) {
                shooter = lowestByCol[activeCols[Math.floor(Math.random() * activeCols.length)]];
            }

            enemyBullets.push({
                x: shooter.x,
                y: shooter.y + 12,
                type: chosenType,
                slot: chosenSlot,
                steps: 0,
                animFrame: 0
            });
        }

        function update() {
            pollGamepad();
            if (!gameActive) return;
            frame++;
            if (stageBannerTimer > 0) stageBannerTimer--;
            if (statusBannerTimer > 0) statusBannerTimer--;
            if (alienFreezeTimer > 0) alienFreezeTimer--;

            // Brief authentic pause between waves after clearing all 55 invaders
            if (waveClearTimer > 0) {
                waveClearTimer--;
                for (let si = spriteExplosions.length - 1; si >= 0; si--) {
                    spriteExplosions[si].timer++;
                    if (spriteExplosions[si].timer >= spriteExplosions[si].maxTimer) {
                        spriteExplosions.splice(si, 1);
                    }
                }
                for (let spi = scorePopups.length - 1; spi >= 0; spi--) {
                    if (scorePopups[spi].delay > 0) scorePopups[spi].delay--;
                    scorePopups[spi].timer--;
                    if (scorePopups[spi].timer <= 0) scorePopups.splice(spi, 1);
                }
                if (waveClearTimer <= 0) {
                    level++;
                    bullets = [];
                    enemyBullets = [];
                    initBunkers();
                    spawnWave();
                }
                return;
            }

            if (player) player.update();

            // Mystery Ship (UFO) spawn & update (only spawns when >= 8 invaders remain, authentic ROM rule)
            if (!ufo) {
                if (enemies.length >= 8 && (!player || !player.exploding)) {
                    ufoSpawnTimer--;
                    if (ufoSpawnTimer <= 0) {
                        // Direction depends on shotCount parity (authentic ROM rule)
                        const dir = (shotCount % 2 === 0) ? 1 : -1;
                        ufo = {
                            x: dir === 1 ? -20 : WIDTH + 20,
                            y: 84, // Cleanly centered in red cellophane band (y = 64..127), below top HUD
                            dir: dir,
                            speed: 2.0 // Exact 1 arcade pixel per frame
                        };
                        ufoSpawnTimer = 1536; // Authentic ROM 0x0600 frame interval (~25.6s)
                    }
                }
            } else if (!player || !player.exploding) {
                ufo.x += ufo.dir * ufo.speed;
                if (frame % 9 === 0) playUfoWarble();
                if ((ufo.dir === 1 && ufo.x > WIDTH + 28) || (ufo.dir === -1 && ufo.x < -28)) {
                    ufo = null;
                }
            }

            // Player bullets update & swept collisions (4 arcade px/frame = 8 screen px/frame)
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                const prevY = b.y;
                b.y -= 8;
                const segTop = b.y - 4;
                const segBottom = prevY + 4;

                // 1. Swept collision with destructible bunkers/shields
                let consumed = false;
                for (let bi = 0; bi < bunkers.length; bi++) {
                    const hit = bunkers[bi].checkSegmentHit(b.x, prevY, b.y, 1);
                    if (hit) {
                        bunkers[bi].erode(hit.x, hit.y, 3.0);
                        createExplosion(hit.x, hit.y, 6, 'shot');
                        bullets.splice(i, 1);
                        if (player) player.shotLockTimer = 10;
                        consumed = true;
                        break;
                    }
                }
                if (consumed) continue;

                // 2. Swept bullet-vs-bullet collision with incoming alien missiles
                for (let ebi = enemyBullets.length - 1; ebi >= 0; ebi--) {
                    const eb = enemyBullets[ebi];
                    if (Math.abs(b.x - eb.x) < 6 && segTop <= eb.y + 7 && segBottom >= eb.y - 7) {
                        createExplosion(b.x, eb.y, 8, 'shot');
                        bullets.splice(i, 1);
                        enemyBullets.splice(ebi, 1);
                        if (player) player.shotLockTimer = 10;
                        consumed = true;
                        break;
                    }
                }
                if (consumed) continue;

                // 3. Swept collision with Mystery Ship (UFO) — checked before ceiling so high UFO hits register cleanly
                if (ufo && Math.abs(b.x - ufo.x) <= 17 && segTop <= ufo.y + 8 && segBottom >= ufo.y - 8) {
                    const ufoPts = UFO_SCORE_TABLE[(Math.max(1, shotCount) - 1) % UFO_SCORE_TABLE.length];
                    awardScore(ufoPts);
                    createExplosion(ufo.x, ufo.y, 20, 'ufo');
                    // Sequential reveal: red ufo_explosion shows for 22 frames, then red mystery score displays for 62 frames
                    scorePopups.push({ x: ufo.x, y: ufo.y - 7, text: ufoPts.toString(), color: PALETTE.R, delay: 22, timer: 84 });
                    playUfoExplosionSound();
                    ufo = null;
                    bullets.splice(i, 1);
                    if (player) player.shotLockTimer = 12;
                    continue;
                }

                // 4. Swept per-type AABB collision with Invaders
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    const halfW = e.halfW || ((e.type === 'squid' || e.type === 'boss') ? 9 : ((e.type === 'crab' || e.type === 'butterfly') ? 12 : 13));
                    if (Math.abs(b.x - e.x) <= halfW && segTop <= e.y + 8 && segBottom >= e.y - 8) {
                        bullets.splice(i, 1);
                        consumed = true;
                        e.hp = (e.hp || 1) - 1;
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, 14, 'alien');
                            const pts = e.points || (e.type === 'squid' ? 30 : (e.type === 'crab' ? 20 : 10));
                            if (ei < rippleCursor) rippleCursor = Math.max(0, rippleCursor - 1);
                            enemies.splice(ei, 1);
                            awardScore(pts);
                            alienFreezeTimer = 15; // Authentic 1978 15-frame CPU pause on alien death
                            playInvaderKilledSound();
                        }
                        break;
                    }
                }
                if (consumed) continue;

                // 5. Top ceiling splash at top of red cellophane band (y <= 66, cleanly below white score HUD)
                if (b.y <= 66) {
                    createExplosion(b.x, 68, 6, 'shot');
                    bullets.splice(i, 1);
                    if (player) player.shotLockTimer = 12;
                }
            }

            // Authentic 1978 Invader Fleet 1-Alien-Per-Frame Ripple March & Lockstep 4-Note Bass Heartbeat
            if (enemies.length > 0 && (!player || !player.exploding) && alienFreezeTimer <= 0) {
                fleetStepTimer++;

                // 1-Alien-Per-Frame Intel 8080 Ripple Step (bottom-to-top, left-to-right)
                if (rippleCursor >= enemies.length) {
                    rippleCursor = 0;
                    fleetAnimFrame = (fleetAnimFrame + 1) % 2;
                    if (fleetDropPass) {
                        fleetDropPass = false;
                        edgeHitDuringPass = false;
                    } else if (edgeHitDuringPass) {
                        fleetDir *= -1;
                        fleetDropPass = true;
                        edgeHitDuringPass = false;
                    }
                }

                // Sync the 4-note analog bass directly to the start of each full rack step (55 -> 5 frames);
                // when <= 4 invaders remain (sweeping faster than 5 frames), cap smoothly at the authentic 5-frame ROM floor!
                if (enemies.length >= 5) {
                    if (rippleCursor === 0) {
                        fleetStepTimer = 0;
                        playMarchStepSound();
                    }
                } else if (fleetStepTimer >= 5) {
                    fleetStepTimer = 0;
                    playMarchStepSound();
                }

                const steppingEnemy = enemies[rippleCursor];
                if (steppingEnemy) {
                    // Classic last-alien speed asymmetry ("fastest invader in the galaxy": +6px right, -4px left)
                    const stepX = enemies.length === 1 ? (fleetDir > 0 ? 6 : -4) : (fleetDir * 4);
                    if (fleetDropPass) {
                        steppingEnemy.y += 16; // Drop 8 arcade pixels (16 screen px)
                        steppingEnemy.x += stepX;
                    } else {
                        steppingEnemy.x += stepX;
                    }
                    steppingEnemy.animFrame = ((steppingEnemy.animFrame || 0) + 1) % 2;

                    if ((fleetDir > 0 && steppingEnemy.x >= WIDTH - 24) ||
                        (fleetDir < 0 && steppingEnemy.x <= 24)) {
                        edgeHitDuringPass = true;
                    }

                    // Invaders physically slice/erode any shield pixels they march through
                    if (steppingEnemy.y >= 368) {
                        const ew = steppingEnemy.halfW || 12;
                        for (let bi = 0; bi < bunkers.length; bi++) {
                            bunkers[bi].erodeBox(steppingEnemy.x - ew, steppingEnemy.y - 8, steppingEnemy.x + ew, steppingEnemy.y + 8);
                        }
                    }

                    rippleCursor++;
                    if (rippleCursor >= enemies.length) {
                        rippleCursor = 0;
                        fleetAnimFrame = (fleetAnimFrame + 1) % 2;
                        if (fleetDropPass) {
                            fleetDropPass = false;
                            edgeHitDuringPass = false;
                        } else if (edgeHitDuringPass) {
                            fleetDir *= -1;
                            fleetDropPass = true;
                            edgeHitDuringPass = false;
                        }
                    }
                }
            }

            // Check invaders reaching player defense line (immediate Invasion Game Over!)
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                e.update();
                if (gameActive && player && !player.exploding) {
                    if (e.y >= player.y - 12) {
                        handlePlayerHit(true);
                        break;
                    }
                }
            }

            // Authentic 1978 Score-Based Reload Rate Alien Missile Firing (up to 3 simultaneous shots from Wave 1!)
            if (gameActive && enemies.length > 0 && (!player || !player.exploding)) {
                const reloadRate = getAlienReloadRate(score);
                const allShotsClearedReload = enemyBullets.every(eb => (eb.steps || 0) >= reloadRate);
                if (alienShotCooldown > 0) alienShotCooldown--;
                if (enemyBullets.length < 3 && allShotsClearedReload && alienShotCooldown <= 0) {
                    spawnAlienMissile();
                    alienShotCooldown = 6;
                }
            }

            // Enemy bullets: authentic 3-frame round-robin ticks (4 arcade px/tick normally, 5 when <= 8 aliens remain)
            const stepPx = enemies.length <= 8 ? 10 : 8;
            for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
                const eb = enemyBullets[bi];
                const slot = eb.slot !== undefined ? eb.slot : (eb.type === 'plunger' ? 1 : (eb.type === 'squiggly' ? 2 : 0));
                const prevY = eb.y;
                if (frame % 3 === slot) {
                    eb.y += stepPx;
                    eb.steps = (eb.steps || 0) + 1;
                    eb.animFrame = ((eb.animFrame || 0) + 1) % 4;
                }

                // Swept bunker hit from above
                let hitBunker = false;
                for (let bki = 0; bki < bunkers.length; bki++) {
                    const hit = bunkers[bki].checkSegmentHit(eb.x, prevY, eb.y + 4, 2);
                    if (hit) {
                        bunkers[bki].erode(hit.x, hit.y + 2, 3.2);
                        createExplosion(hit.x, hit.y, 5, 'shot');
                        enemyBullets.splice(bi, 1);
                        hitBunker = true;
                        break;
                    }
                }
                if (hitBunker) continue;

                // Bottom green ground line splash & authentic pixel erosion (y >= 474)
                if (eb.y >= 474) {
                    erodeGroundLine(eb.x);
                    createExplosion(eb.x, 470, 5, 'shot');
                    enemyBullets.splice(bi, 1);
                    continue;
                }

                // Swept player hit check (runs every frame so active or injected missiles hit cleanly)
                if (gameActive && player && !player.exploding && player.invulnerable <= 0) {
                    const ebTop = Math.min(prevY, eb.y) - 6;
                    const ebBot = Math.max(prevY, eb.y) + 6;
                    if (Math.abs(eb.x - player.x) <= 13 && ebBot >= player.y - 8 && ebTop <= player.y + 8) {
                        enemyBullets.splice(bi, 1);
                        handlePlayerHit(false);
                    }
                }
            }

            // Sprite explosions & score popups update
            for (let si = spriteExplosions.length - 1; si >= 0; si--) {
                spriteExplosions[si].timer++;
                if (spriteExplosions[si].timer >= spriteExplosions[si].maxTimer) {
                    spriteExplosions.splice(si, 1);
                }
            }
            for (let spi = scorePopups.length - 1; spi >= 0; spi--) {
                if (scorePopups[spi].delay > 0) scorePopups[spi].delay--;
                scorePopups[spi].timer--;
                if (scorePopups[spi].timer <= 0) scorePopups.splice(spi, 1);
            }

            // Wave cleared -> brief authentic transition pause, then next wave & restored shields/ground line
            if (enemies.length === 0 && waveClearTimer <= 0) {
                bullets = [];
                enemyBullets = [];
                ufo = null;
                waveClearTimer = 45;
            }

            const scoreEl = document.getElementById('score-display');
            if (scoreEl) scoreEl.innerText = (score % 10000).toString().padStart(4, '0');
            if (score > highScore) {
                highScore = score;
                const hiEl = document.getElementById('high-score');
                if (hiEl) hiEl.innerText = (highScore % 10000).toString().padStart(4, '0');
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Authentic 1978 Top HUD rendered in crisp 7x10 arcade bitmap font (white band, y = 0..63)
            drawArcadeText('SCORE<1>', 30, 14, PALETTE.W, 1, 'left');
            drawArcadeText('HI-SCORE', WIDTH / 2, 14, PALETTE.W, 1, 'center');
            drawArcadeText('SCORE<2>', WIDTH - 30, 14, PALETTE.W, 1, 'right');

            drawArcadeText((score % 10000).toString().padStart(4, '0'), 68, 32, PALETTE.W, 1, 'center');
            drawArcadeText((highScore % 10000).toString().padStart(4, '0'), WIDTH / 2, 32, PALETTE.W, 1, 'center');

            if (gameActive || player) {
                // Destructible green shields/bunkers
                bunkers.forEach(bk => bk.draw());

                // Mystery Ship (UFO) in red top band
                if (ufo) {
                    drawSprite(SPRITES.ufo, ufo.x, ufo.y, PALETTE.R);
                }

                // Player Laser Base
                if (player) player.draw();

                // Invaders (automatically colored scanline-by-scanline by CRT cellophane band!)
                enemies.forEach(e => e.draw());

                // Player laser shot (exact 1x4 arcade pixels -> 2x8 screen pixels)
                bullets.forEach(b => {
                    ctx.fillStyle = getCellophaneColor(b.y);
                    ctx.fillRect(Math.round(b.x - 1), Math.round(b.y - 4), 2, 8);
                });

                // 3 Distinct Animated Alien Missile Types (Rolling, Plunger, Squiggly)
                enemyBullets.forEach(eb => {
                    const key = eb.type === 'plunger' ? 'shot_plunger' : (eb.type === 'squiggly' ? 'shot_squiggly' : 'shot_rolling');
                    const animIdx = (eb.animFrame !== undefined ? eb.animFrame : Math.floor(frame / 4)) % 4;
                    drawSprite(SPRITES[key][animIdx], eb.x, eb.y);
                });

                // Authentic pixel-art explosion sprites
                spriteExplosions.forEach(se => {
                    if (se.type === 'ufo') {
                        drawSprite(SPRITES.ufo_explosion, se.x, se.y, PALETTE.R);
                    } else if (se.type === 'shot') {
                        drawSprite(SPRITES.shot_explosion, se.x, se.y, se.color);
                    } else if (se.type === 'alien') {
                        drawSprite(SPRITES.alien_explosion, se.x, se.y, se.color);
                    }
                });

                // Destructible bottom green ground baseline (authentic 1978 scanline y = 238 -> 476, chipped by alien shots!)
                ctx.fillStyle = PALETTE.G;
                if (!groundLine || groundLine.length === 0) initGroundLine();
                for (let gx = 0; gx < groundLine.length; gx++) {
                    if (groundLine[gx]) {
                        ctx.fillRect(gx * SCALE, 476, SCALE, SCALE);
                    }
                }

                // Bottom-left lives digit (WHITE) & Reserve Laser Bases (GREEN, matching Midway cellophane map!)
                drawArcadeText(Math.max(0, lives).toString(), 22, 490, PALETTE.W, 1, 'left');
                for (let i = 0; i < Math.min(5, Math.max(0, lives - 1)); i++) {
                    drawSprite(SPRITES.player, 68 + i * 32, 495, PALETTE.G, 2);
                }

                // Bottom-right CREDIT 00 (WHITE, authentic 1978 layout)
                drawArcadeText('CREDIT 00', WIDTH - 22, 490, PALETTE.W, 1, 'right');

                // Floating mystery score popups (appear cleanly after ufo_explosion finishes)
                scorePopups.forEach(sp => {
                    if ((sp.delay || 0) <= 0) {
                        drawArcadeText(sp.text, sp.x, sp.y + 2, sp.color, 1, 'center');
                    }
                });

                // Classic Wave 1 player start prompt & brief status banners (e.g. EXTRA BASE / GAME OVER)
                if (stageBannerTimer > 0 && Math.floor(frame / 6) % 2 === 0) {
                    drawArcadeText('PLAY PLAYER<1>', WIDTH / 2, 102, PALETTE.R, 1, 'center');
                }
                if (statusBannerTimer > 0) {
                    drawArcadeText(statusBannerText, WIDTH / 2, 102, statusBannerColor, 1, 'center');
                }
            }
        }

        const ARCADE_FPS = 60.0;
        const STEP_MS = 1000 / ARCADE_FPS;
        let lastTime = 0, accumulator = 0;

        function loop(timestamp) {
            pollGamepad();
            if (typeof timestamp === 'number') {
                if (!lastTime) lastTime = timestamp;
                const delta = Math.min(timestamp - lastTime, 100);
                lastTime = timestamp;
                accumulator += delta;
                while (accumulator >= STEP_MS) {
                    update();
                    accumulator -= STEP_MS;
                }
            } else {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        const keys = {};
        const touchState = { left: false, right: false, fire: false };
        const gamepadState = { left: false, right: false, fire: false, connected: false, name: '' };
        // Invert CRKD ATOM / controller horizontal direction by default; user can toggle anytime via [⇄ L/R] or Select (-)
        let controllerInvertX = true;
        try {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('si_invert_lr') !== null) {
                controllerInvertX = localStorage.getItem('si_invert_lr') === '1';
            }
        } catch (e) {}
        let prevGamepadStartPressed = false;
        let prevGamepadSelectPressed = false;
        let lastTelemetrySig = '';

        function sendInputTelemetry(tag, data) {
            try {
                const sig = tag + ':' + JSON.stringify(data);
                if (sig === lastTelemetrySig) return;
                lastTelemetrySig = sig;
                if (typeof fetch === 'function') {
                    fetch('/telemetry?t=' + encodeURIComponent(sig), { cache: 'no-store' }).catch(() => {});
                }
            } catch (e) {}
        }

        function syncFlipButtonUI() {
            const btn = document.getElementById('flip-lr-btn');
            if (btn) {
                btn.innerText = controllerInvertX ? '⇄ L/R: FLIPPED' : '⇄ L/R: NORMAL';
                btn.style.borderColor = controllerInvertX ? '#00ff44' : '#c77dff';
                btn.style.color = controllerInvertX ? '#00ff44' : '#c77dff';
            }
            const statusEl = document.getElementById('gamepad-status');
            if (statusEl && gamepadState.connected) {
                statusEl.innerText = `🎮 CRKD ATOM READY (${controllerInvertX ? 'L/R FLIPPED' : 'L/R NORMAL'} - TAP TO SWAP)`;
            }
        }

        function toggleInvertLR() {
            controllerInvertX = !controllerInvertX;
            try {
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('si_invert_lr', controllerInvertX ? '1' : '0');
                }
            } catch (e) {}
            syncFlipButtonUI();
            statusBannerText = controllerInvertX ? 'L/R DIRECTION: FLIPPED' : 'L/R DIRECTION: NORMAL';
            statusBannerColor = '#C77DFF';
            statusBannerTimer = 75;
            playSfx(controllerInvertX ? 880 : 660, 'square', 0.07, 440, 0.05);
            sendInputTelemetry('toggle_invert', { controllerInvertX });
        }

        // Normalize keyboard + Android Gamepad / CRKD ATOM Keyboard-mode key events
        function resolveKeyCodes(e) {
            const codes = [];
            if (e && e.code) codes.push(e.code);
            const k = e && e.key;
            const kc = e && e.keyCode;
            if (k === 'ArrowLeft' || kc === 21 || kc === 37) codes.push('ArrowLeft');
            if (k === 'ArrowRight' || kc === 22 || kc === 39) codes.push('ArrowRight');
            if (k === ' ' || k === 'Enter' ||
                kc === 23 || // KEYCODE_DPAD_CENTER
                kc === 66 || // KEYCODE_ENTER
                kc === 96 || // KEYCODE_BUTTON_A
                kc === 97 || // KEYCODE_BUTTON_B
                kc === 99 || // KEYCODE_BUTTON_X
                kc === 100 || // KEYCODE_BUTTON_Y
                kc === 102 || // KEYCODE_BUTTON_L1
                kc === 103 || // KEYCODE_BUTTON_R1
                kc === 104 || // KEYCODE_BUTTON_L2
                kc === 105 || // KEYCODE_BUTTON_R2
                kc === 108) { // KEYCODE_BUTTON_START
                codes.push('Space');
            }
            return codes;
        }

        window.onkeydown = e => {
            ensureAudio();
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = true; });
            sendInputTelemetry('keydown', { code: e && e.code, key: e && e.key, keyCode: e && e.keyCode, matched, invert: controllerInvertX });
            if (!gameActive && (matched.includes('Space') || matched.includes('Enter') || (e && e.keyCode === 108))) {
                if (e && e.preventDefault) e.preventDefault();
                startGame();
            }
        };
        window.onkeyup = e => {
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = false; });
        };

        // Full W3C Gamepad API polling for CRKD ATOM Collectible Keychain Controller
        // Supports Android Mode (Cyan), X-Input Mode (Orange), Switch Mode (White), and Stick-Remap modes
        function isBtnPressed(btn) {
            if (!btn) return false;
            if (typeof btn === 'object') return Boolean(btn.pressed || (btn.value && btn.value > 0.35));
            return Boolean(btn);
        }

        function updateGamepadStatusUI(connected, idStr = '') {
            const statusEl = document.getElementById('gamepad-status');
            if (!statusEl) return;
            if (connected) {
                const isCrkd = /crkd|atom|pro controller|xbox|gamepad|wireless controller/i.test(idStr);
                const label = isCrkd ? '🎮 CRKD ATOM CONTROLLER CONNECTED' : `🎮 CONTROLLER READY (${idStr.slice(0, 22)})`;
                statusEl.innerText = label;
                statusEl.style.color = '#00ff44';
            } else {
                statusEl.innerText = '🎮 CRKD ATOM / GAMEPAD: PRESS ANY BUTTON';
                statusEl.style.color = '#c77dff';
            }
        }

        function pollGamepad() {
            if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
            let pads;
            try {
                pads = navigator.getGamepads();
            } catch (e) {
                return;
            }
            if (!pads) return;

            let left = false, right = false, fire = false, startBtn = false, selectBtn = false;
            let foundPad = null;

            for (let i = 0; i < pads.length; i++) {
                const gp = pads[i];
                if (!gp || gp.connected === false) continue;
                foundPad = gp;
                const btns = gp.buttons || [];
                const axes = gp.axes || [];

                const activeBtns = [];
                for (let bi = 0; bi < btns.length; bi++) {
                    if (isBtnPressed(btns[bi])) activeBtns.push(bi);
                }
                const activeAxes = [];
                for (let ai = 0; ai < axes.length; ai++) {
                    const v = axes[ai];
                    if (typeof v === 'number' && Math.abs(v) > 0.25 && Math.abs(v - 1.2857) > 0.15 && Math.abs(v - 3.2857) > 0.15) {
                        activeAxes.push(ai + ':' + v.toFixed(2));
                    }
                }
                if (activeBtns.length > 0 || activeAxes.length > 0) {
                    sendInputTelemetry('pad', { id: gp.id, btns: activeBtns, axes: activeAxes, invert: controllerInvertX });
                }

                // 1. D-Pad Left / Right (Standard buttons 14 = Left, 15 = Right)
                if (isBtnPressed(btns[14])) left = true;
                if (isBtnPressed(btns[15])) right = true;

                // 2. Analog Axes / CRKD ATOM D-Pad-to-Stick modes:
                //    axes[0] = Left Stick X, axes[2] = Right Stick X, axes[4] / axes[6] = Android D-Input D-Pad X
                const horizAxes = [axes[0], axes[2], axes[4], axes[6]];
                for (let ai = 0; ai < horizAxes.length; ai++) {
                    const val = horizAxes[ai];
                    if (typeof val === 'number' && !Number.isNaN(val)) {
                        if (val < -0.3) left = true;
                        if (val > 0.3) right = true;
                    }
                }

                // 3. DirectInput / Switch Mode 8-way POV Hat Switch on axes[9] (Android Chrome HID mapping)
                if (axes.length >= 10 && typeof axes[9] === 'number') {
                    const hat = axes[9];
                    // Centered hat is typically > 1.1 (e.g., 1.2857 or 3.2857) or 0.0
                    // Right: Up-Right (-0.714), Right (-0.428), Down-Right (-0.142)
                    // Left: Down-Left (0.428), Left (0.714), Up-Left (1.0)
                    if (hat >= -0.80 && hat <= -0.05) right = true;
                    if (hat >= 0.35 && hat <= 1.05) left = true;
                }

                // 4. Fire buttons: CRKD ATOM B/A/Y/X face buttons (0, 1, 2, 3) + L/R shoulder buttons (4, 5, 6, 7)
                if (isBtnPressed(btns[0]) || isBtnPressed(btns[1]) ||
                    isBtnPressed(btns[2]) || isBtnPressed(btns[3]) ||
                    isBtnPressed(btns[4]) || isBtnPressed(btns[5]) ||
                    isBtnPressed(btns[6]) || isBtnPressed(btns[7])) {
                    fire = true;
                }

                // Select (-) button (8) toggles L/R direction when in-game
                if (isBtnPressed(btns[8])) {
                    selectBtn = true;
                }

                // 5. Start (+), CRKD Home (9, 16) or any face button starts game from menu
                if (isBtnPressed(btns[9]) || isBtnPressed(btns[16]) || fire) {
                    startBtn = true;
                }
            }

            if (selectBtn && !prevGamepadSelectPressed) {
                toggleInvertLR();
            }
            prevGamepadSelectPressed = selectBtn;

            if (foundPad && !gamepadState.connected) {
                gamepadState.connected = true;
                gamepadState.name = foundPad.id || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
                syncFlipButtonUI();
                sendInputTelemetry('pad_connected', { id: gamepadState.name });
            } else if (!foundPad && gamepadState.connected) {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            }

            if (controllerInvertX) {
                const tmp = left;
                left = right;
                right = tmp;
            }

            gamepadState.left = left;
            gamepadState.right = right;
            gamepadState.fire = fire;

            // Reflect physical controller input on the corner HUD indicators if visible
            const lEl = document.getElementById('l-btn');
            const rEl = document.getElementById('r-btn');
            const fEl = document.getElementById('f-btn');
            if (lEl && lEl.classList && !touchState.left) lEl.classList.toggle('active', left);
            if (rEl && rEl.classList && !touchState.right) rEl.classList.toggle('active', right);
            if (fEl && fEl.classList && !touchState.fire) fEl.classList.toggle('active', fire);

            // Edge-triggered start from menu overlay when pressing Start / Select / B / A / Y / X on CRKD ATOM
            if (startBtn && !prevGamepadStartPressed && !gameActive) {
                ensureAudio();
                startGame();
                // Prevent the button press that started the game from firing immediately on frame 1
                if (player) player.cooldown = 14;
            }
            prevGamepadStartPressed = startBtn;
        }

        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('gamepadconnected', e => {
                const gp = e && e.gamepad;
                gamepadState.connected = true;
                gamepadState.name = (gp && gp.id) || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
            });
            window.addEventListener('gamepaddisconnected', () => {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            });
        }

        function ensureAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }
        function setBtnState(el, k, state) {
            touchState[k] = state;
            if (el && el.classList) el.classList.toggle('active', state);
        }
        function bind(id, k) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, true);
                ensureAudio();
            };
            const deactivate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, false);
            };
            el.ontouchstart = activate;
            el.ontouchend = deactivate;
            el.ontouchcancel = deactivate;
            el.onmousedown = activate;
            el.onmouseup = deactivate;
            el.onmouseleave = deactivate;
        }
        bind('l-btn', 'left'); bind('r-btn', 'right'); bind('f-btn', 'fire');

        // Allow smooth thumb sliding between Left and Right buttons on the D-pad
        const dpadGroup = document.getElementById('dpad-group');
        if (dpadGroup) {
            const handleDpadTouch = e => {
                if (e && e.preventDefault) e.preventDefault();
                ensureAudio();
                const lEl = document.getElementById('l-btn');
                const rEl = document.getElementById('r-btn');
                if (!lEl || !rEl || !lEl.getBoundingClientRect) return;
                const lRect = lEl.getBoundingClientRect();
                const rRect = rEl.getBoundingClientRect();
                let leftHit = false, rightHit = false;
                const touches = e.touches || [];
                for (let i = 0; i < touches.length; i++) {
                    const t = touches[i];
                    if (t.clientX >= lRect.left - 12 && t.clientX <= lRect.right + 6 &&
                        t.clientY >= lRect.top - 24 && t.clientY <= lRect.bottom + 24) {
                        leftHit = true;
                    }
                    if (t.clientX >= rRect.left - 6 && t.clientX <= rRect.right + 12 &&
                        t.clientY >= rRect.top - 24 && t.clientY <= rRect.bottom + 24) {
                        rightHit = true;
                    }
                }
                setBtnState(lEl, 'left', leftHit);
                setBtnState(rEl, 'right', rightHit);
            };
            dpadGroup.ontouchstart = handleDpadTouch;
            dpadGroup.ontouchmove = handleDpadTouch;
            dpadGroup.ontouchend = handleDpadTouch;
            dpadGroup.ontouchcancel = handleDpadTouch;
        }

        function renderScoreTableIcons() {
            if (typeof document === 'undefined' || !document.querySelectorAll) return;
            const icons = document.querySelectorAll('.score-icon');
            icons.forEach(c => {
                const ic = c.getContext && c.getContext('2d');
                if (!ic) return;
                ic.clearRect(0, 0, c.width, c.height);
                const key = c.getAttribute('data-sprite');
                const color = c.getAttribute('data-color') || PALETTE.W;
                const spr = key === 'ufo' ? SPRITES.ufo : (SPRITES[key] && SPRITES[key][0]);
                if (spr) drawSprite(spr, c.width / 2, c.height / 2, color, 2, ic);
            });
        }

        function startGame() {
            ensureAudio();
            score = 0;
            level = 1;
            lives = 3;
            bonusLifeAwarded = false;
            shotCount = 0;
            waveClearTimer = 0;
            bullets = [];
            enemyBullets = [];
            particles = [];
            spriteExplosions = [];
            scorePopups = [];
            ufo = null;
            statusBannerTimer = 0;
            player = new Player();
            initBunkers();
            spawnWave();
            gameActive = true;
            const scoreEl = document.getElementById('score-display');
            if (scoreEl) scoreEl.innerText = '0000';
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = '3';
            const titleEl = document.getElementById('menu-title');
            if (titleEl) titleEl.innerText = 'SPACE INVADERS';
            const subEl = document.getElementById('menu-sub');
            if (subEl) subEl.innerText = '1978 TAITO / MIDWAY ROM REPLICA';
            const btnEl = document.getElementById('start-btn');
            if (btnEl) btnEl.innerText = 'INSERT COIN / START';
            document.getElementById('menu-overlay').style.display = 'none';
        }

        document.getElementById('start-btn').onclick = startGame;

        let deferredInstallPrompt = null;
        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferredInstallPrompt = e;
                const installBtn = document.getElementById('install-btn');
                if (installBtn && installBtn.style) installBtn.style.display = 'inline-block';
            });
            window.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                const installBtn = document.getElementById('install-btn');
                if (installBtn && installBtn.style) installBtn.style.display = 'none';
            });
        }
        const installBtnEl = document.getElementById('install-btn');
        if (installBtnEl) {
            installBtnEl.onclick = async () => {
                if (!deferredInstallPrompt) return;
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                if (installBtnEl.style) installBtnEl.style.display = 'none';
            };
        }

        const flipBtnEl = document.getElementById('flip-lr-btn');
        if (flipBtnEl) {
            flipBtnEl.onclick = e => {
                if (e && e.stopPropagation) e.stopPropagation();
                ensureAudio();
                toggleInvertLR();
            };
        }
        const gpStatusEl = document.getElementById('gamepad-status');
        if (gpStatusEl) {
            gpStatusEl.style.cursor = 'pointer';
            gpStatusEl.onclick = () => {
                ensureAudio();
                toggleInvertLR();
            };
        }

        window.onload = () => {
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            syncFlipButtonUI();
            renderScoreTableIcons();
            initBunkers();
            loop();
            if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => {
                    if (reg && reg.update) reg.update();
                }).catch(() => {});
            }
        };
    </script>
</body>
</html>
