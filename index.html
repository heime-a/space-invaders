<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Space Invaders">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Space Invaders (1978) - Authentic Arcade Replica</title>
    <style>
        :root {
            --arcade-black: #000000;
            --arcade-red: #ff2a2a;
            --arcade-cyan: #00ffff;
            --arcade-yellow: #ffff00;
            --arcade-white: #f0f0f0;
            --arcade-green: #00ff44;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #080808;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            aspect-ratio: 448 / 512;
            /* Dynamically scale 7:8 arcade playfield (224x256 @ 2x) to fit viewport without clipping */
            width: min(calc(100vw - 16px), calc((100vh - 16px) * (448 / 512)));
            width: min(calc(100dvw - 16px), calc((100dvh - 16px) * (448 / 512)));
            height: auto;
            max-height: calc(100vh - 16px);
            max-height: calc(100dvh - 16px);
            background: var(--arcade-black);
            overflow: hidden;
            border: 3px solid #222;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            outline: 2px solid #000;
        }

        /* Authentic CRT scanline & subtle cellophane phosphor glow */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 68, 0.02), rgba(0, 0, 255, 0.02));
            z-index: 25;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* Hidden semantic DOM mirror for screen readers & tests; crisp 1978 pixel HUD renders directly on canvas */
        #ui-layer {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            pointer-events: none;
        }

        .red-text { color: var(--arcade-red); }
        .white-text { color: var(--arcade-white); }
        .green-text { color: var(--arcade-green); }

        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            text-align: center;
            padding: 16px;
        }

        #score-table {
            margin-top: 16px;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(10, 10, 10, 0.88);
            font-size: clamp(0.78rem, 1.9vmin, 0.98rem);
            line-height: 1.7;
            letter-spacing: 2px;
            text-align: left;
        }

        #score-table .table-header {
            text-align: center;
            color: var(--arcade-white);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 8px;
            padding-bottom: 4px;
            font-weight: bold;
        }

        .score-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0;
        }

        .score-icon {
            width: 32px;
            height: 16px;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        #start-btn {
            margin-top: 22px;
            background: none;
            border: 2px solid var(--arcade-green);
            color: var(--arcade-green);
            padding: 12px 28px;
            font-size: clamp(1.05rem, 2.5vmin, 1.4rem);
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(0, 255, 68, 0.25);
        }

        #start-btn:active {
            background: rgba(0, 255, 68, 0.2);
        }

        /* Ergonomic split thumb controls anchored at bottom-left & bottom-right corners */
        #controls-wrapper {
            position: fixed;
            left: max(18px, var(--safe-left));
            right: max(18px, var(--safe-right));
            bottom: max(18px, var(--safe-bottom));
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 50;
        }

        #dpad-group {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .t-btn {
            width: 80px;
            height: 80px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.75);
            pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: transform 0.06s ease, background-color 0.06s ease, border-color 0.06s ease;
        }

        .t-btn.active,
        .t-btn:active {
            transform: scale(0.93);
            background: rgba(0, 255, 68, 0.22);
            border-color: var(--arcade-green);
            color: var(--arcade-white);
        }

        #f-btn {
            width: 88px;
            height: 88px;
            border-color: rgba(255, 42, 42, 0.65);
            color: var(--arcade-red);
            background: rgba(40, 0, 0, 0.55);
        }

        #f-btn.active,
        #f-btn:active {
            background: rgba(255, 42, 42, 0.3);
            border-color: var(--arcade-red);
        }

        /* Show touch controls on touch screens (including Z Fold 8 unfolded & folded) */
        @media (pointer: coarse), (hover: none), (max-width: 1024px) {
            #controls-wrapper {
                display: flex;
            }
        }

        /*
         * When in portrait / squarish unfolded orientation (aspect ratio < 1.15, e.g. Z Fold 8
         * unfolded portrait ~3:4 or cover screen), reserve vertical space at the bottom so the
         * corner thumb controls never obscure the player laser base or bottom HUD.
         */
        @media (max-aspect-ratio: 115/100) and (pointer: coarse),
               (max-aspect-ratio: 115/100) and (max-width: 1024px) {
            #game-wrapper {
                justify-content: flex-start;
                padding-top: 8px;
            }
            #game-container {
                width: min(calc(100vw - 12px), calc((100vh - 122px) * (448 / 512)));
                width: min(calc(100dvw - 12px), calc((100dvh - 122px) * (448 / 512)));
                max-height: calc(100vh - 122px);
                max-height: calc(100dvh - 122px);
            }
        }

        /* Compact button sizing for narrow cover display when folded */
        @media (max-width: 500px) {
            #game-container {
                border: none;
                border-radius: 0;
                width: min(100vw, calc((100vh - 108px) * (448 / 512)));
                width: min(100dvw, calc((100dvh - 108px) * (448 / 512)));
                max-height: calc(100vh - 108px);
                max-height: calc(100dvh - 108px);
            }
            .t-btn {
                width: 68px;
                height: 68px;
                font-size: 26px;
            }
            #f-btn {
                width: 74px;
                height: 74px;
            }
            #dpad-group {
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // Original 1978 hardware resolution: 224x256 rotated vertical monitor, rendered at 2x scale (448x512)
        const WIDTH = 448, HEIGHT = 512, SCALE = 2;

        const PALETTE = {
            'W': '#F0F0F0', // White phosphor band (central playfield)
            'R': '#FF2A2A', // Red cellophane overlay (top UFO band)
            'G': '#00FF44', // Green cellophane overlay (shields, laser base, bottom line)
            'Y': '#FFFF00',
            'C': '#00FFFF',
            '.': 'transparent'
        };

        // Authentic Taito/Midway CRT cellophane overlay color based on vertical Y scanline (256p -> 512p @ 2x)
        // Top HUD (0..63): White | UFO & ceiling band (64..127): Red | Main field (128..367): White | Bunkers/Player/Ground (368+): Green
        function getCellophaneColor(y) {
            if (y >= 64 && y < 128) return PALETTE.R;
            if (y >= 368) return PALETTE.G;
            return PALETTE.W;
        }

        // Authentic 1978 Space Invaders deterministic 15-shot Mystery Ship score table!
        // The 23rd shot (and every 15th shot thereafter: 23, 38, 53...) awards 300 points.
        const UFO_SCORE_TABLE = [100, 50, 50, 100, 150, 100, 100, 300, 50, 100, 100, 100, 50, 150, 100];

        // Authentic 1978 ROM column firing tables (0-indexed columns 0..10)
        const PLUNGER_COL_TABLE = [0, 6, 0, 0, 0, 3, 10, 0, 5, 2, 0, 0, 10, 8, 1, 7];
        const SQUIGGLY_COL_TABLE = [10, 0, 5, 2, 0, 0, 10, 8, 1, 7, 1, 10, 3, 6, 9];

        // Authentic 1978 ROM march bass sound delay tables (0x1A11 / 0x1A21): 52 frames down to 5 frames at 1 alien
        const MARCH_SOUND_THRESHOLDS = [50, 43, 36, 28, 22, 17, 13, 10, 8, 7, 6, 5, 4, 3, 2, 1];
        const MARCH_SOUND_DELAYS = [52, 46, 39, 34, 28, 24, 21, 19, 16, 14, 13, 12, 11, 10, 9, 7, 5];

        // Authentic 1978 ROM wave starting Y offsets (0x1DA3 AlienStartTable, converted to 2x top-down screen px)
        // Wave 1 = 0, Wave 2 = +48, Wave 3 = +80, Waves 4-6 = +96, Waves 7-9 = +112, then Wave 10 loops back to Wave 2
        const WAVE_START_DROP_TABLE = [48, 80, 96, 96, 96, 112, 112, 112];

        // Authentic 1978 7x10 crisp 1px-stroke Arcade Character ROM (proportional to 448x512 CRT, with slashed zero)
        const ARCADE_FONT = {
            '0': ["0111110","1000001","1000011","1000101","1001001","1010001","1100001","1000001","1000001","0111110"],
            '1': ["0001000","0011000","0101000","0001000","0001000","0001000","0001000","0001000","0001000","0111110"],
            '2': ["0111110","1000001","0000001","0000001","0000110","0011000","0100000","1000000","1000000","1111111"],
            '3': ["0111110","1000001","0000001","0000001","0011110","0000001","0000001","0000001","1000001","0111110"],
            '4': ["0000100","0001100","0010100","0100100","1000100","1000100","1111111","0000100","0000100","0000100"],
            '5': ["1111111","1000000","1000000","1111110","0000001","0000001","0000001","0000001","1000001","0111110"],
            '6': ["0011110","0100000","1000000","1000000","1111110","1000001","1000001","1000001","1000001","0111110"],
            '7': ["1111111","0000001","0000010","0000100","0001000","0001000","0010000","0010000","0010000","0010000"],
            '8': ["0111110","1000001","1000001","1000001","0111110","1000001","1000001","1000001","1000001","0111110"],
            '9': ["0111110","1000001","1000001","1000001","0111111","0000001","0000001","0000010","0000100","0111000"],
            'A': ["0011100","0100010","1000001","1000001","1000001","1111111","1000001","1000001","1000001","1000001"],
            'B': ["1111110","1000001","1000001","1000001","1111110","1000001","1000001","1000001","1000001","1111110"],
            'C': ["0111110","1000001","1000000","1000000","1000000","1000000","1000000","1000000","1000001","0111110"],
            'D': ["1111100","1000010","1000001","1000001","1000001","1000001","1000001","1000001","1000010","1111100"],
            'E': ["1111111","1000000","1000000","1000000","1111110","1000000","1000000","1000000","1000000","1111111"],
            'F': ["1111111","1000000","1000000","1000000","1111110","1000000","1000000","1000000","1000000","1000000"],
            'G': ["0111110","1000001","1000000","1000000","1000000","1001111","1000001","1000001","1000001","0111110"],
            'H': ["1000001","1000001","1000001","1000001","1111111","1000001","1000001","1000001","1000001","1000001"],
            'I': ["0111110","0001000","0001000","0001000","0001000","0001000","0001000","0001000","0001000","0111110"],
            'L': ["1000000","1000000","1000000","1000000","1000000","1000000","1000000","1000000","1000000","1111111"],
            'M': ["1000001","1100011","1010101","1001001","1000001","1000001","1000001","1000001","1000001","1000001"],
            'N': ["1000001","1100001","1010001","1001001","1000101","1000011","1000001","1000001","1000001","1000001"],
            'O': ["0111110","1000001","1000001","1000001","1000001","1000001","1000001","1000001","1000001","0111110"],
            'P': ["1111110","1000001","1000001","1000001","1111110","1000000","1000000","1000000","1000000","1000000"],
            'R': ["1111110","1000001","1000001","1000001","1111110","1001000","1000100","1000010","1000001","1000001"],
            'S': ["0111110","1000001","1000000","1000000","0111110","0000001","0000001","0000001","1000001","0111110"],
            'T': ["1111111","0001000","0001000","0001000","0001000","0001000","0001000","0001000","0001000","0001000"],
            'U': ["1000001","1000001","1000001","1000001","1000001","1000001","1000001","1000001","1000001","0111110"],
            'V': ["1000001","1000001","1000001","1000001","1000001","1000001","0100010","0100010","0010100","0001000"],
            'W': ["1000001","1000001","1000001","1000001","1000001","1001001","1001001","1010101","1100011","1000001"],
            'X': ["1000001","1000001","0100010","0010100","0001000","0001000","0010100","0100010","1000001","1000001"],
            'Y': ["1000001","1000001","0100010","0010100","0001000","0001000","0001000","0001000","0001000","0001000"],
            '<': ["0000100","0001000","0010000","0100000","1000000","0100000","0010000","0001000","0000100","0000000"],
            '>': ["0010000","0001000","0000100","0000010","0000001","0000010","0000100","0001000","0010000","0000000"],
            '-': ["0000000","0000000","0000000","0000000","0111110","0000000","0000000","0000000","0000000","0000000"],
            '!': ["0001000","0001000","0001000","0001000","0001000","0001000","0001000","0000000","0001000","0001000"],
            '/': ["0000001","0000010","0000010","0000100","0001000","0001000","0010000","0100000","0100000","1000000"],
            ':': ["0000000","0000000","0001000","0001000","0000000","0000000","0001000","0001000","0000000","0000000"],
            ' ': ["0000000","0000000","0000000","0000000","0000000","0000000","0000000","0000000","0000000","0000000"]
        };

        function drawArcadeText(text, x, y, color = PALETTE.W, scale = 1, align = 'left') {
            const str = String(text).toUpperCase();
            const charAdvance = 10 * scale; // 7px glyph + 3px spacing = 10px crisp arcade pitch
            const totalW = str.length * charAdvance - 3 * scale;
            let startX = x;
            if (align === 'center') startX = Math.round(x - totalW / 2);
            else if (align === 'right') startX = Math.round(x - totalW);
            ctx.fillStyle = color;
            for (let i = 0; i < str.length; i++) {
                const glyph = ARCADE_FONT[str[i]] || ARCADE_FONT[' '];
                const gx = startX + i * charAdvance;
                for (let r = 0; r < glyph.length; r++) {
                    const row = glyph[r];
                    for (let c = 0; c < row.length; c++) {
                        if (row[c] === '1') {
                            ctx.fillRect(gx + c * scale, y + r * scale, scale, scale);
                        }
                    }
                }
            }
        }

        // Pixel-perfect 1978 ROM bitmaps
        const SPRITES = {
            // Player Laser Base (13x8)
            player: [
                "......G......",
                ".....GGG.....",
                ".....GGG.....",
                ".GGGGGGGGGGG.",
                "GGGGGGGGGGGGG",
                "GGGGGGGGGGGGG",
                "GGGGGGGGGGGGG",
                "GGGGGGGGGGGGG"
            ],
            // Player death explosion 2-frame alternating shatter (16x8)
            player_explosion: [
                [
                    "....G.....G.....",
                    ".G...G...G...G..",
                    "..G...G.G...G...",
                    "...G.GGGGG.G....",
                    "G..GGGGGGGGG..G.",
                    "...GGGGGGGGG....",
                    "..G.GGGGGGG.G...",
                    ".G..G..G..G..G.."
                ],
                [
                    ".G.....G....G...",
                    "...G..G.G.G...G.",
                    ".G..G.....G..G..",
                    "....GGGGGGG.....",
                    "..GGGGGGGGGGG...",
                    ".G.GGGGGGGGG.G..",
                    "....GGGGGGG.....",
                    "..G..G...G..G..."
                ]
            ],
            // Top Row: Squid / Small Invader (8x8 centered in 12x8) - 30 PTS
            squid: [
                [
                    ".....WW.....",
                    "....WWWW....",
                    "...WWWWWW...",
                    "..WW.WW.WW..",
                    "..WWWWWWWW..",
                    "....W..W....",
                    "...W.WW.W...",
                    "..W.W..W.W.."
                ],
                [
                    ".....WW.....",
                    "....WWWW....",
                    "...WWWWWW...",
                    "..WW.WW.WW..",
                    "..WWWWWWWW..",
                    "...W.WW.W...",
                    "..W......W..",
                    "...W....W..."
                ]
            ],
            // Middle 2 Rows: Crab / Medium Invader (11x8 centered in 12x8) - 20 PTS
            crab: [
                [
                    "..W.....W...",
                    "...W...W....",
                    "..WWWWWWW...",
                    ".WW.WWW.WW..",
                    "WWWWWWWWWWW.",
                    "W.WWWWWWW.W.",
                    "W.W.....W.W.",
                    "...WW.WW...."
                ],
                [
                    "..W.....W...",
                    "W..W...W..W.",
                    "W.WWWWWWW.W.",
                    "WWW.WWW.WWW.",
                    "WWWWWWWWWWW.",
                    ".WWWWWWWWW..",
                    "..W.....W...",
                    ".W.......W.."
                ]
            ],
            // Bottom 2 Rows: Octopus / Large Invader (12x8) - 10 PTS
            octopus: [
                [
                    "....WWWW....",
                    ".WWWWWWWWWW.",
                    "WWWWWWWWWWWW",
                    "WWW..WW..WWW",
                    "WWWWWWWWWWWW",
                    "...WW..WW...",
                    "..WW.WW.WW..",
                    "WW........WW"
                ],
                [
                    "....WWWW....",
                    ".WWWWWWWWWW.",
                    "WWWWWWWWWWWW",
                    "WWW..WW..WWW",
                    "WWWWWWWWWWWW",
                    "..WWW..WWW..",
                    ".WW..WW..WW.",
                    "..WW....WW.."
                ]
            ],
            // Mystery Ship / Flying Saucer UFO (16x7) - 50/100/150/300 PTS
            ufo: [
                ".....RRRRRR.....",
                "...RRRRRRRRRR...",
                "..RRRRRRRRRRRR..",
                ".RR.RR.RR.RR.RR.",
                "RRRRRRRRRRRRRRRR",
                "..RRR..RR..RRR..",
                "...R........R..."
            ],
            // UFO Explosion (21x8)
            ufo_explosion: [
                "...R...R..R....R.....",
                ".R...R...RR..R...R...",

        function getAudioCtx() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();

            if (audioCtx && audioCtx.state === 'suspended' && audioCtx.resume) {

            return audioCtx;

        // Pre-generate CD4006 18-stage shift-register PRBS white noise buffer for explosions & laser shot
        function getNoiseBuffer(ctx) {
            if (noiseBuffer || !ctx || !ctx.createBuffer) return noiseBuffer;
            const sampleRate = ctx.sampleRate || 44100;
            const length = sampleRate * 1.2;
            noiseBuffer = ctx.createBuffer(1, length, sampleRate);
            const data = noiseBuffer.getChannelData(0);
            let lfsr = 0x1ffff;
            for (let i = 0; i < length; i++) {
                // 18-bit LFSR tap matching digital noise generator characteristics
                const bit = ((lfsr >> 0) ^ (lfsr >> 7)) & 1;
                lfsr = (lfsr >> 1) | (bit << 17);
                data[i] = (bit ? 1.0 : -1.0) * (0.75 + Math.random() * 0.25);
            }
            return noiseBuffer;
        }

        function playSfx(freq, type = 'square', duration = 0.1, endFreq = 10, gainLevel = 0.06) {
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime || 0;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), now + duration);
                gain.gain.setValueAtTime(gainLevel, now);
                gain.gain.linearRampToValueAtTime(0, now + duration);

                if (ctx.createBiquadFilter) {
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(Math.max(320, freq * 3.5), now);
                    osc.connect(filter);
                    filter.connect(gain);
                } else {
                    osc.connect(gain);
                }
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {}
        }

        // Port 5 Bits 0..3: LM556 4-note bass heartbeat ("thump-thump-thump-thump")

            if (soundCallLog.length > 64) soundCallLog.shift();

                const now = ctx.currentTime || 0;
                const dur = 0.085;
                const osc = ctx.createOscillator();

                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.78, now + dur);

                subOsc.type = 'square';
                subOsc.frequency.setValueAtTime(freq * 0.5, now);
                subOsc.frequency.exponentialRampToValueAtTime(freq * 0.42, now + dur);

                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime ?
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur) :
                    gain.gain.linearRampToValueAtTime(0, now + dur);

                if (ctx.createBiquadFilter) {
                    const lp = ctx.createBiquadFilter();
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(210, now);
                    lp.Q.setValueAtTime(2.2, now);
                    osc.connect(lp);
                    subOsc.connect(lp);
                    lp.connect(gain);
                } else {
                    osc.connect(gain);
                    subOsc.connect(gain);
                }
                gain.connect(ctx.destination);
                osc.start(now);
                subOsc.start(now);
                osc.stop(now + dur);

        // Port 3 Bit 3: LM3900 FM-modulated descending warble when an invader is killed ("BWO-O-O-W!")
        function playInvaderKilledSound() {
            soundCallLog.push({ type: 'invader_killed' });

            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime || 0;
                const dur = 0.24;
                const carrier = ctx.createOscillator();
                const modOsc = ctx.createOscillator();
                const modGain = ctx.createGain();
                const outGain = ctx.createGain();

                carrier.type = 'square';
                // Stepped / exponential sweep from 1040 Hz down to 150 Hz
                carrier.frequency.setValueAtTime(1040, now);
                carrier.frequency.exponentialRampToValueAtTime(480, now + dur * 0.45);
                carrier.frequency.exponentialRampToValueAtTime(150, now + dur);

                // ~38 Hz LM3900 pitch modulation gives the iconic 1978 warbling alien death chirp
                modOsc.type = 'triangle';
                modOsc.frequency.setValueAtTime(38, now);
                modGain.gain.setValueAtTime(175, now);
                modGain.gain.linearRampToValueAtTime(45, now + dur);

                outGain.gain.setValueAtTime(0.075, now);
                outGain.gain.linearRampToValueAtTime(0, now + dur);

                if (carrier.frequency && typeof carrier.frequency === 'object') {
                    try {
                        modOsc.connect(modGain);
                        modGain.connect(carrier.frequency);
                    } catch (_) {}
                }
                carrier.connect(outGain);
                outGain.connect(ctx.destination);
                carrier.start(now);
                modOsc.start(now);
                carrier.stop(now + dur);
                modOsc.stop(now + dur);
            } catch (e) {}

        function drawSprite(data, x, y, overrideColor = null, scale = SCALE, targetCtx = ctx) {
            const rows = data.length;
            const cols = data[0].length;
            const halfW = (cols * scale) / 2;
            const halfH = (rows * scale) / 2;
            for (let ri = 0; ri < rows; ri++) {
                const row = data[ri];
                const py = Math.round(y - halfH + ri * scale);
                const rowColor = overrideColor || getCellophaneColor(py);
                for (let ci = 0; ci < cols; ci++) {
                    const ch = row[ci];
                    if (ch !== '.') {
                        targetCtx.fillStyle = overrideColor || (ch === 'W' ? rowColor : (PALETTE[ch] || rowColor));
                        targetCtx.fillRect(Math.round(x - halfW + ci * scale), py, scale, scale);
                    }
                }
            }
        }

        // Authentic jagged 8x8 blast mask for carving destructible shields/bunkers (matches shot_explosion sprite)
        const BUNKER_BLAST_MASK = [
            "10010010",
            "01011010",
            "00111100",
            "11111111",
            "11111111",
            "00111100",
            "01011010",
            "10010010"
        ];

        class Bunker {
            constructor(x, y) {
                this.x = x; // Top-left X
                this.y = y; // Top-left Y
                this.rows = SPRITES.bunker.length; // 16
                this.cols = SPRITES.bunker[0].length; // 22
                this.width = this.cols * SCALE; // 44
                this.height = this.rows * SCALE; // 32
                this.pixels = SPRITES.bunker.map(row => row.split('').map(ch => ch !== '.'));
            }
            // Check if a point (px, py) hits any intact pixel of this bunker
            checkHit(px, py, radius = 3) {
                if (px < this.x - radius || px > this.x + this.width + radius ||
                    py < this.y - radius || py > this.y + this.height + radius) {
                    return false;
                }
                const cCenter = Math.floor((px - this.x) / SCALE);
                const rCenter = Math.floor((py - this.y) / SCALE);
                for (let r = Math.max(0, rCenter - 1); r <= Math.min(this.rows - 1, rCenter + 1); r++) {
                    for (let c = Math.max(0, cCenter - 1); c <= Math.min(this.cols - 1, cCenter + 1); c++) {
                        if (this.pixels[r][c]) return true;
                    }
                }
                return false;
            }
            // Swept vertical segment check from (px, y0) to (px, y1) so fast shots never tunnel through thin shield pixels
            checkSegmentHit(px, y0, y1, halfWidthPx = 1) {
                if (px + halfWidthPx < this.x || px - halfWidthPx >= this.x + this.width) return null;
                const minY = Math.min(y0, y1);
                const maxY = Math.max(y0, y1);
                if (maxY < this.y || minY >= this.y + this.height) return null;

                const dir = y1 >= y0 ? 1 : -1;
                const steps = Math.max(1, Math.ceil(Math.abs(y1 - y0) / SCALE));
                const c0 = Math.max(0, Math.floor((px - halfWidthPx - this.x) / SCALE));
                const c1 = Math.min(this.cols - 1, Math.floor((px + halfWidthPx - this.x) / SCALE));
                for (let s = 0; s <= steps; s++) {
                    const sy = y0 + (dir * s * Math.abs(y1 - y0)) / steps;
                    const r = Math.floor((sy - this.y) / SCALE);
                    if (r < 0 || r >= this.rows) continue;
                    for (let c = c0; c <= c1; c++) {
                        if (this.pixels[r][c]) {
                            return { x: px, y: this.y + r * SCALE + SCALE * 0.5 };
                        }
                    }
                }
                return null;
            }
            // Stamp authentic jagged 1978 shot-explosion crater into bunker pixels around (px, py)
            erode(px, py, blastRadius = 3.2) {
                const cCenter = Math.floor((px - this.x) / SCALE);
                const rCenter = Math.floor((py - this.y) / SCALE);
                const maskRows = BUNKER_BLAST_MASK.length;
                const maskCols = BUNKER_BLAST_MASK[0].length;
                const halfR = Math.floor(maskRows / 2);
                const halfC = Math.floor(maskCols / 2);
                for (let mr = 0; mr < maskRows; mr++) {
                    const r = rCenter - halfR + mr;
                    if (r < 0 || r >= this.rows) continue;
                    for (let mc = 0; mc < maskCols; mc++) {
                        if (BUNKER_BLAST_MASK[mr][mc] !== '1') continue;
                        const c = cCenter - halfC + mc;
                        if (c < 0 || c >= this.cols) continue;
                        if (blastRadius >= 3.0 || (Math.abs(mr - halfR) <= 2 && Math.abs(mc - halfC) <= 2)) {
                            this.pixels[r][c] = false;
                        }
                    }
                }
            }
            // Slice shield pixels overlapped by a low-marching invader
            erodeBox(left, top, right, bottom) {
                const c0 = Math.max(0, Math.floor((left - this.x) / SCALE));
                const c1 = Math.min(this.cols - 1, Math.floor((right - this.x) / SCALE));
                const r0 = Math.max(0, Math.floor((top - this.y) / SCALE));
                const r1 = Math.min(this.rows - 1, Math.floor((bottom - this.y) / SCALE));
                for (let r = r0; r <= r1; r++) {
                    for (let c = c0; c <= c1; c++) {
                        this.pixels[r][c] = false;
                    }
                }
            }
            draw() {
                ctx.fillStyle = PALETTE.G;
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (this.pixels[r][c]) {
                            ctx.fillRect(this.x + c * SCALE, this.y + r * SCALE, SCALE, SCALE);
                        }
                    }
                }
            }
        }

            groundLine = new Array(WIDTH / SCALE).fill(true);
